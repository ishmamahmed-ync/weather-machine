  #cmp .imgs .clip img{width:auto; height:100%; max-width:none}
  #cmp.broken .knob{background:var(--wm-faint); color:var(--wm-bg); cursor:not-allowed}
  #cmp.broken .bar{background:var(--wm-faint)}
  #cmp.broken input[type=range]{pointer-events:none}
  /* a locked wipe is often narrow (Mozambique): the left label above the frame, the right one below, and the
     message under the handle, wrapping inside the frame, so nothing overlaps */
  #cmp.broken .lab.l{top:auto; bottom:100%; margin:0 0 6px}
  #cmp.broken .msg{top:calc(50% + 26px); transform:none; padding:0 10px; white-space:normal; line-height:1.35}

  @media (max-width:760px){
    #stage{position:fixed; top:0; left:0; right:0; height:52vh; bottom:auto}
    #fade{background:linear-gradient(0deg, var(--wm-bg) 0, var(--wm-bg) 46vh, rgba(5,8,14,0) 56vh)}
    #explore{left:16px; right:16px; width:auto; top:4rem; max-height:46vh}
    #hintbar{display:none}
    .step.is-flow{padding:54vh var(--wm-gutter) 16px}
    .step.is-flow .wm-slide > *{max-width:none !important; width:auto !important}
  }
</style>

<script id="WM">/*__WM_JS__*/</script>

<script id="ENGINE">
// set by scripts/build_all.py from the sections file: nav = show the slide navigator; partial = a mock or
// test build that places only some slides (no warnings for the rest)
const PAGE = __PAGE__;
function START(){
 try {
  const cv=document.getElementById('globe'), ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.body.style.background=LOOK.background;

  // live state, editable from the panel
  const live={ layers:{}, look:Object.assign({},LOOK) };
  for(const k in LAYERS) live.layers[k]=Object.assign({},LAYERS[k]);

  function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

  function decode(L){
    const st=L.s,N=Math.round(360/st),la0=Math.round(90/st),lo0=Math.round(180/st);
    const out=new Float32Array(L.n.length*3); let idx=0;
    for(let i=0;i<L.n.length;i++){ idx+=L.d[i];
      const la=Math.floor(idx/N)-la0, lo=idx-(la+la0)*N-lo0;
      out[i*3]=lo*st+st/2; out[i*3+1]=la*st+st/2; out[i*3+2]=L.n[i]; }
    return out;
  }
  const L={}, MAXN={}, ISPT={};
  for(const k in LAYERS){
    if(LAYERS[k].plugin) continue;                     // drawn by a prototype's plugin, from the prototype's own data
    if(!DATA[k]){ console.warn('no data for layer "'+k+'"'); continue; }
    if(DATA[k].type==='points'){ L[k]=Float32Array.from(DATA[k].xy); ISPT[k]=true; continue; }
    if(DATA[k].type==='tracks'||DATA[k].type==='bubbles'||DATA[k].type==='shell'||DATA[k].type==='timeline'){
      L[k]=DATA[k]; ISPT[k]=DATA[k].type; continue; }
    L[k]=decode(DATA[k]); let m=0;
    for(let i=2;i<L[k].length;i+=3) if(L[k][i]>m)m=L[k][i];
    MAXN[k]=m;
    if(LAYERS[k].maxOf) MAXN[k]=-1;                    // set below, from the layer it is a part of
  }

  // ---------------- the slide text: one fixed place (design system, .wm-slide) ----------------
  const story=document.getElementById('story'), slideEl=document.getElementById('slide');
  const esc=s=>String(s).replace(/&(?!\w+;|#\d+;)/g,'&amp;');
  const swatch=(col,line)=>'<i class="wm-swatch'+(line?' is-line':'')+'" style="background:'+col+'"></i>';
  const RAMP=['Tropical storm','Category 1','Category 2','Category 3','Category 4','Category 5'];
  function legendHTML(s){
    const b=s.below||{};
    let keys;
    if(b.legend===false || s.cards) keys=[];          // instrument cards are the legend
    else if(Array.isArray(b.legend)) keys=b.legend;
    else { const on=new Set(); (s.views||[]).forEach(v=>Object.keys(v.layers||{}).forEach(k=>{ if((v.layers[k]||0)>=0.5 && LAYERS[k]) on.add(k); })); keys=[...on]; }
    let items=keys.filter(k=>LAYERS[k] && !LAYERS[k].classes).map(k=>{ const c=LAYERS[k];
      return '<span>'+swatch(c.color||(c.ramp&&c.ramp[c.ramp.length-1])||'#ECEAE5', !!c.ramp)+esc(c.label)+'</span>'; });
    let classes='';
    if(keys.includes('gauges')){
      const LBL=['no gauge','under 0.1','0.1 to 0.5','0.5 to 1','1 to 2','2 to 5','5 to 10','10 or more'];
      classes='<span class="wm-label">'+esc(LAYERS.gauges.label)+'</span><div class="wm-legend">'+
        LBL.map((l,i)=>'<span>'+swatch(WM.GAUGE[i])+l+'</span>').reverse().join('')+'</div>';
    }
    if(b.ramp) items=items.concat(LAYERS.storms.ramp.map((c,i)=>'<span>'+swatch(c,true)+RAMP[i]+'</span>'));
    if(b.key) items=items.concat(b.key.map(x=>'<span>'+swatch(x.color,!!x.line)+esc(x.label)+'</span>'));
    return classes+(items.length ? '<div class="wm-legend">'+items.join('')+'</div>' : '');
  }
  // a thin timeline (design system .wm-events): one tick a year; events above the line (side 'up') and below
  // ('down') on tiers, each with a hairline down (or up) to its date. Up labels end at their tick, down labels
  // start at theirs, so the tiers are set so no hairline crosses a label.
  function eventsHTML(E){
    if(E.vertical) return eventsVertical(E);
    const pc=y=>((y-E.from)/(E.to-E.from)*100).toFixed(2)+'%';
    let ticks='';
    // a tick at each year's start, its label centred in the year (clear of the events' hairlines)
    for(let y=Math.ceil(E.from);y<E.to;y++) ticks+='<i class="tk" style="left:'+pc(y)+'"></i><span class="yr" style="left:'+pc(y+0.5)+'">'+y+'</span>';
    const ev=E.items.map(x=>'<div class="ev is-'+x.side+'" style="left:'+pc(x.at)+'; --tier:'+x.tier+'">'+
      '<span class="lb"><b>'+esc(x.when)+'</b> '+esc(x.text)+'</span></div>').join('');
    const up=Math.max(0,...E.items.filter(x=>x.side==='up').map(x=>x.tier)), dn=Math.max(0,...E.items.filter(x=>x.side==='down').map(x=>x.tier));
    return '<div class="wm-events" style="--up:'+up+'; --down:'+dn+'">'+
      (E.upLabel?'<span class="side up">'+esc(E.upLabel)+'</span>':'')+(E.downLabel?'<span class="side down">'+esc(E.downLabel)+'</span>':'')+
      '<div class="axis">'+ticks+ev+'</div></div>';
  }
  // the vertical form (design system .wm-events.is-vertical): every event on its own row in date order, evenly
  // spaced, a dot on one vertical line; filled for one side (the US), hollow for the other (the wider world)
  function eventsVertical(E){
    const items=E.items.slice().sort((a,b)=>a.at-b.at);
    return '<div class="wm-events is-vertical"><div class="key">'+
      '<span><i class="dot is-up"></i>'+esc(E.upLabel||'')+'</span><span><i class="dot is-down"></i>'+esc(E.downLabel||'')+'</span>'+
      (E.shortNote?'<span class="ill">'+esc(E.shortNote)+'</span>':'')+'</div>'+
      '<ol>'+items.map(x=>'<li class="is-'+x.side+'"><span class="when">'+esc(x.when)+'</span><i class="dot is-'+x.side+'"></i><span class="lb">'+esc(x.text)+'</span></li>').join('')+'</ol></div>';
  }
  // a thin-line dial (design system .wm-dial): the ring is one unit (an hour); the value sweeps round it,
  // laps past the first go on an inner ring. Two large numbers beside it.
  function dialHTML(D){
    const laps=D.value/D.unit, R1=44, R2=37, C=r=>2*Math.PI*r;
    const arc=(r,frac,cls)=>'<circle class="'+cls+'" cx="50" cy="50" r="'+r+'" style="--len:'+C(r).toFixed(2)+'; --to:'+(C(r)*(1-Math.min(1,frac))).toFixed(2)+'"/>';
    let rings='<circle class="track" cx="50" cy="50" r="'+R1+'"/>'+arc(R1,laps,'val');
    if(laps>1) rings+=arc(R2,laps-1,'val lap');
    return '<div class="wm-dial"><div class="ring"><svg viewBox="0 0 100 100" aria-hidden="true">'+rings+'</svg>'+
      (D.caption?'<span class="wm-note cap">'+esc(D.caption)+'</span>':'')+'</div>'+
      '<div class="nums">'+D.stats.map(x=>'<div><span class="wm-stat">'+esc(x.v)+'</span><span class="wm-note">'+esc(x.note)+'</span></div>').join('')+'</div></div>';
  }
  function barsHTML(B){
    const mx=Math.max(...B.rows.map(r=>r.v));
    return '<div class="wm-bars">'+(B.caption?'<span class="wm-label">'+esc(B.caption)+'</span>':'')+B.rows.map(r=>
      '<div class="wm-bar'+(r.ref?' is-ref':'')+'"'+(r.color?' style="--c:'+r.color+'"':'')+'>'+
        '<span class="k">'+esc(r.k)+'</span><span class="v">'+esc(r.label||r.v.toLocaleString('en-US'))+(r.note?'<small>'+esc(r.note)+'</small>':'')+'</span>'+
        '<span class="track"><span class="fill" style="width:'+(100*r.v/mx).toFixed(2)+'%"></span></span></div>').join('')+'</div>';
  }
  // the narration: label, title, subtitle, quote, paragraphs. Prototype sections get only this
  // part (their [data-slide-text] slot); what goes below it is theirs.
  function narrationHTML(s){
    const b=s.below||{};
    let h='<p class="wm-label">'+esc(s.act||'')+'</p><h2 class="wm-display">'+esc(s.title)+'</h2>';
    if(s.sub) h+='<p class="wm-sub">'+esc(s.sub)+'</p>';
    h+='<div class="text">';
    if(s.quote) h+='<p class="wm-quote'+(s.quote.long?' is-long':'')+'">'+esc(s.quote.text)+'</p><p class="wm-note">'+esc(s.quote.by)+'</p>';
    (s.text||[]).forEach(par=>{
      if(typeof par==='string'){ h+='<p class="wm-lead">'+esc(par)+'</p>'; return; }
      // a beat: appears at its time (s after the slide arrives), with its number set large above it
      h+='<p class="wm-lead beat" style="--at:'+(par.at||0)+'s">'+(par.stat?'<span class="wm-stat"'+(par.color?' style="color:'+par.color+'"':'')+'>'+esc(par.stat)+'</span>':'')+esc(par.text||'')+'</p>';
    });
    if(b.end) h+='<div class="end">'+b.end.map(x=>'<p class="wm-quote">'+esc(x)+'</p>').join('')+'</div>';
    return h+'</div>';
  }
  function slideHTML(s){
    const b=s.below||{};
    let h=narrationHTML(s)+'<div class="below">';
    if(s.plugin) h+='<div data-plugin-panel="'+esc(s.plugin)+'"></div>';
    if(b.stats) h+='<div class="stats">'+b.stats.map(x=>'<div><span class="wm-stat">'+esc(x.v)+'</span><span class="wm-note">'+esc(x.note)+'</span></div>').join('')+'</div>';
    if(b.bars) h+=barsHTML(b.bars);
    h+=legendHTML(s);
    if(b.grow) h+='<span class="wm-note">Storm seasons 2006 to <span data-year="grow">2026</span></span>';
    if((s.views||[]).some(v=>Object.keys(v.layers||{}).some(k=>LAYERS[k]&&LAYERS[k].sweep&&v.layers[k]>0)))
      h+='<div class="wm-readout sweep"><b data-year="sweep">1970</b><span data-count="sweep"></span></div>';
    if(b.events) h+=eventsHTML(b.events);
    if(b.dial) h+=dialHTML(b.dial);
    if(b.links) h+='<div class="wm-links">'+b.links.map(x=>'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+
      '<span class="wm-label">'+esc(x.label)+'</span><span class="name">'+esc(x.name)+
      ' <svg viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 10L10 3M4.5 3H10v5.5"/></svg></span>'+
      '<span class="what">'+esc(x.what)+'</span></a>').join('')+'</div>';
    if(b.note) h+='<span class="wm-note">'+esc(b.note)+'</span>';

  // gentle (the author, 5 Oct): long steady stretches, a few slow stutters; small dips, never dark
  const FLICKER=[2600,420, 900,300, 380,520, 3200,700, 1800,360, 420,300, 2400,900];

    const arr=L[key], c=proj.rotate(), ctr=[-c[0],-c[1]];
    if(cfg.square){                                         // one square per cell, sized like the density grids
      const sz=Math.max(0.3,(proj.scale()/210)*SETTINGS.dotScale*(cfg.size===undefined?1:cfg.size)), h=sz/2;
      ctx.fillStyle=cfg.color; ctx.globalAlpha=alpha*(cfg.alpha===undefined?0.95:cfg.alpha);
      for(let i=0;i<arr.length;i+=2){ const lo=arr[i],la=arr[i+1];
        if(d3.geoDistance([lo,la],ctr)>1.5533) continue; const xy=proj([lo,la]); if(xy) ctx.fillRect(xy[0]-h,xy[1]-h,sz,sz); }

    }
    // grow gently with zoom (fourth root) so close-ups don't turn into blobs
    const g=Math.min(2.6,Math.max(0.6,Math.pow(proj.scale()/520,0.25)));
    const r=Math.max(0.5,(cfg.dot===undefined?1.3:cfg.dot)*g*SETTINGS.dotScale);
    if(cfg.flicker && !reduce){
      // a failing bulb, gently: every light dims and returns together in an irregular rhythm of long and short
      // bursts (ms; even entries on, odd entries dim), each change eased over FLICKER_FADE ms
      const P=FLICKER, t=performance.now()%FLICKER_LEN; let k=0, acc=0; while(acc+P[k]<=t){ acc+=P[k]; k++; }
      const lv=j=>(((j%P.length)+P.length)%P.length)%2===0 ? 1 : FLICKER_LOW, f=Math.min(1,(t-acc)/FLICKER_FADE);
      const lvl=lv(k-1)+(lv(k)-lv(k-1))*(f*f*(3-2*f));           // eased from the last level to this one
      ctx.fillStyle=cfg.color; ctx.globalAlpha=alpha*(cfg.alpha===undefined?1:cfg.alpha)*lvl;   // calm even when on
      ctx.beginPath();
      for(let i=0;i<arr.length;i+=2){ const lo=arr[i],la=arr[i+1];
        if(d3.geoDistance([lo,la],ctr)>1.5533) continue; const xy=proj([lo,la]); if(!xy) continue;
        ctx.moveTo(xy[0]+r,xy[1]); ctx.arc(xy[0],xy[1],r,0,6.2832); }
      ctx.fill(); ctx.globalAlpha=1; return;
    }
    ctx.fillStyle=cfg.color; ctx.globalAlpha=alpha*(cfg.alpha===undefined?0.95:cfg.alpha);
    ctx.beginPath();
    for(let i=0;i<arr.length;i+=2){
      const lo=arr[i],la=arr[i+1];
      if(d3.geoDistance([lo,la],ctr)>1.5533) continue;
      const xy=proj([lo,la]); if(!xy) continue;
      ctx.moveTo(xy[0]+r,xy[1]);
      ctx.arc(xy[0],xy[1],r,0,6.2832);
    }
    ctx.fill(); ctx.globalAlpha=1;
  }

  // storm tracks: one polyline per storm, coloured by peak category,
  // with a bright pulse travelling along each track.
  let pulse=0, growYear=Infinity;
  function drawTracks(key,cfg,alpha){
    const D=L[key], xy=D.xy, lens=D.len, cats=D.cat, ramp=cfg.ramp||['#FFFFFF'], yrs=D.yr;
    const c=proj.rotate(), ctr=[-c[0],-c[1]], s=proj.scale();
    const lw=Math.max(0.5,(cfg.width||1)*Math.min(2.2,Math.max(0.55,Math.pow(s/520,0.28))));
    let p=0;
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(let k=0;k<lens.length;k++){
      const n=lens[k], col=ramp[Math.min(ramp.length-1,cats[k])];
      if(yrs && yrs[k]>growYear){ p+=n; continue; }      // not yet: tracks build up season by season
      // base line
      ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.globalAlpha=alpha*0.55;
      ctx.beginPath(); let started=false;
      for(let i=0;i<n;i++){
        const lo=xy[(p+i)*2], la=xy[(p+i)*2+1];
        if(d3.geoDistance([lo,la],ctr)>1.5533){ started=false; continue; }
        const q=proj([lo,la]); if(!q){ started=false; continue; }
        if(!started){ ctx.moveTo(q[0],q[1]); started=true; } else ctx.lineTo(q[0],q[1]);
      }
      ctx.stroke();
      // travelling pulse
      if(cfg.animate!==false && n>2){
        const head=((pulse+k*0.037)%1)*(n-1);
        const i0=Math.max(0,Math.floor(head)-2), i1=Math.min(n-1,Math.floor(head)+1);
        ctx.globalAlpha=alpha; ctx.lineWidth=lw*1.9;
        ctx.beginPath(); started=false;
        for(let i=i0;i<=i1;i++){
          const lo=xy[(p+i)*2], la=xy[(p+i)*2+1];
          if(d3.geoDistance([lo,la],ctr)>1.5533){ started=false; continue; }
          const q=proj([lo,la]); if(!q){ started=false; continue; }
          if(!started){ ctx.moveTo(q[0],q[1]); started=true; } else ctx.lineTo(q[0],q[1]);
        }
        ctx.stroke();
      }
      p+=n;
    }
    ctx.globalAlpha=1;
  }

  // proportional circles: area scales with the value
  function drawBubbles(key,cfg,alpha){
    const D=L[key], xy=D.xy, v=D.v;
    let mx=0; for(let i=0;i<v.length;i++) if(v[i]>mx) mx=v[i];
    const c=proj.rotate(), ctr=[-c[0],-c[1]];
    const k=(cfg.bubble||20)*Math.min(2,Math.max(0.6,Math.pow(proj.scale()/520,0.3)));
    ctx.fillStyle=cfg.color; ctx.globalAlpha=alpha;
    ctx.beginPath();
    for(let i=0;i<v.length;i++){
      const lo=xy[i*2], la=xy[i*2+1];
      if(d3.geoDistance([lo,la],ctr)>1.5533) continue;
      const q=proj([lo,la]); if(!q) continue;
      const r=Math.max(0.8,k*Math.sqrt(v[i]/mx));
      ctx.moveTo(q[0]+r,q[1]); ctx.arc(q[0],q[1],r,0,6.2832);
    }
    ctx.fill(); ctx.globalAlpha=1;
  }

  // a shell of dots floating above the sphere. Not real orbits: geostationary
  // orbit is 6.6 Earth radii out and would not fit on screen beside the planet.
  function drawShell(key,cfg,alpha){
    const D=L[key], xy=D.xy, alt=D.alt||1.08;
    const c=proj.rotate(), ctr=[-c[0],-c[1]], s=proj.scale(), t=proj.translate();
    const r=Math.max(0.6,(cfg.dot||1.4)*Math.min(2.2,Math.max(0.6,Math.pow(s/520,0.25))));
    ctx.fillStyle=cfg.color; ctx.globalAlpha=alpha;
    ctx.beginPath();
    for(let i=0;i<xy.length;i+=2){
      const lo=xy[i],la=xy[i+1];
      const behind=d3.geoDistance([lo,la],ctr)>1.5708;
      const q=proj([lo,la]);
      let x,y;
      if(q && !behind){ x=t[0]+(q[0]-t[0])*alt; y=t[1]+(q[1]-t[1])*alt; }
      else continue;                                  // hide anything round the back
      ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,6.2832);
    }
    ctx.fill(); ctx.globalAlpha=1;
  }

  // stations that switch off as a year cursor advances
  let sweepT=0;
  function drawTimeline(key,cfg,alpha){
    const D=L[key], xy=D.xy, yr=D.y;
    const year=D.from+(D.to-D.from)*sweepT;
    const c=proj.rotate(), ctr=[-c[0],-c[1]];
    const r=Math.max(0.5,(cfg.dot||1)*Math.min(2.4,Math.max(0.6,Math.pow(proj.scale()/520,0.25))));
    ctx.fillStyle=cfg.color; ctx.globalAlpha=alpha;
    ctx.beginPath();
    let live=0; const y0=D.y0;
    for(let i=0;i<yr.length;i++){
      if(yr[i]<year) continue;                        // this one has already stopped
      if(y0 && y0[i]>year) continue;                  // ... or has not started yet
      live++;
      const lo=xy[i*2],la=xy[i*2+1];
      if(d3.geoDistance([lo,la],ctr)>1.5533) continue;
      const q=proj([lo,la]); if(!q) continue;
      ctx.moveTo(q[0]+r,q[1]); ctx.arc(q[0],q[1],r,0,6.2832);
    }
    ctx.fill(); ctx.globalAlpha=1;
    const el=slideEl.querySelector('[data-year="sweep"]');
    if(el){ el.textContent=Math.floor(year); const ro=el.closest('.wm-readout'); if(ro) ro.style.display=LAYERS[key].yearAt?'none':''; }   // on the map instead
    // the year on the map itself (design system display type), when the layer names a place for it
    if(LAYERS[key].yearAt && d3.geoDistance(LAYERS[key].yearAt,ctr)<1.45){ const yq=proj(LAYERS[key].yearAt);
      if(yq){ ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=WM.LOOK.text; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
        ctx.font='500 '+Math.round(Math.max(30,Math.min(56,W*0.034)))+'px '+getComputedStyle(document.documentElement).getPropertyValue('--wm-disp');
        // and under it, the count rising and falling with the year (the author, 5 Oct); both kept inside the screen
        const fs=Math.round(Math.max(12,Math.min(15,W*0.0105))), sans=getComputedStyle(document.documentElement).getPropertyValue('--wm-sans');
        const line2=live.toLocaleString('en-US')+(y0?' cells with a station reporting':' stations still reporting');
        ctx.save(); ctx.font='500 '+fs+'px '+sans; const w2=ctx.measureText(line2).width; ctx.restore();
        const x=Math.min(yq[0], W-24-Math.max(w2, ctx.measureText(String(Math.floor(year))).width));
        ctx.shadowColor='rgba(5,8,14,.9)'; ctx.shadowBlur=12; ctx.fillText(String(Math.floor(year)),x,yq[1]);
        ctx.font='500 '+fs+'px '+sans; ctx.fillStyle=WM.LOOK.text2||WM.LOOK.text;
        ctx.fillText(line2,x+2,yq[1]+fs*1.7); ctx.restore(); } }
    const ce=slideEl.querySelector('[data-count="sweep"]');
    if(ce) ce.textContent=live.toLocaleString('en-US')+(y0?' cells with a station reporting':' stations still reporting');
  }

  // The globe's frame: full size (centred at 70% across, radius R) or, while a big photo shows, the round
  // lens in the top-right corner, centred on the photo's corner (design system: WM.miniView). cur.mini goes
  // 0 (full) to 1 (corner); in between, the centre, the radius and a circular clip move together.
  let lens={cx:0, cy:0, r:Infinity};
  // the lens sits inside the side photo's top-right corner (the author, 5 Oct): read from where the photo is laid out,
  // its radius about 12% of the photo's width (52 to 90 px), inset from the white frame
  function photoLens(){
    const fr=document.querySelector('#photo .wm-frame'); if(!fr || W<760) return null;
    const b=fr.getBoundingClientRect(); if(!b.width) return null;
    const r=Math.max(52,Math.min(90,b.width*0.12)), inset=Math.max(10,r*0.18);
    return { cx:b.right-inset-r, cy:b.top+inset+r, r };
  }
  function frameNow(){
    const m=cur.mini||0, full={cx:W<760?W/2:W*SETTINGS.globeX, cy:H*.5, r:R}, mv=photoLens()||WM.miniView(W,H);
    const L=(a,b)=>a+(b-a)*m;
    lens = m>0.001 ? { cx:L(full.cx,mv.cx), cy:L(full.cy,mv.cy), r:L(Math.hypot(W,H), mv.r) } : { cx:full.cx, cy:full.cy, r:Infinity };
    return { cx:L(full.cx,mv.cx), cy:L(full.cy,mv.cy), r:L(full.r,mv.r), m };
  }
  function render(){
    ctx.clearRect(0,0,W,H);
    const F=frameNow();
    proj.translate([F.cx,F.cy]).scale(F.r*cur.z).rotate(cur.rot);
    const clipped=isFinite(lens.r);
    ctx.save();
    if(clipped){ ctx.beginPath(); ctx.arc(lens.cx,lens.cy,lens.r,0,6.2832); ctx.clip(); }
    const shaded=relief && relief.ok();
    if(shaded) relief.draw();
    else{ ctx.beginPath(); path(sph); ctx.fillStyle=live.look.ocean; ctx.fill(); }
    ctx.beginPath(); path(grat); ctx.strokeStyle=F.m>0.5 ? WM.GLOBE.mini.grat : live.look.graticule; ctx.lineWidth=WM.GLOBE.gratWidth; ctx.stroke();
    if(!shaded){
      ctx.beginPath(); path(DATA.land); ctx.fillStyle=live.look.land; ctx.fill();
      ctx.strokeStyle=live.look.coastline; ctx.lineWidth=.6; ctx.stroke();
    }
    const pl=(!reduce && tgt.pulse) ? 0.6+0.4*Math.cos(performance.now()/1000*2*Math.PI/4) : 1;   // 4 s, gently
    for(const k in LAYERS) drawLayer(k,(cur.a[k]||0)*(pl<1 && tgt.pulse.includes(k) ? pl : 1));
    if(activePlugin && !exp.on) activePlugin.draw(ctx,proj);
    drawSats(cur.sats||0);
    placeFrame(); drawWipe();
    ctx.restore();
    // the edge: the lens's circle while it is smaller than the sphere, otherwise the sphere's own rim
    if(clipped && lens.r < proj.scale()*0.995){ ctx.beginPath(); ctx.arc(lens.cx,lens.cy,lens.r-.5,0,6.2832);
      ctx.strokeStyle=WM.GLOBE.mini.rim; ctx.lineWidth=WM.GLOBE.mini.rimWidth; ctx.stroke(); }
    else { ctx.beginPath(); path(sph); ctx.strokeStyle=F.m>0.5 ? WM.GLOBE.mini.rim : live.look.rim; ctx.lineWidth=WM.GLOBE.rimWidth; ctx.stroke(); }
  }

  // geostationary footprints: a circle on the sphere around each sub-satellite point
  const circle=d3.geoCircle().center([0,0]).radius(SATELLITES.reach).precision(2);
  function drawSats(alpha){
    if(alpha<=.012) return;
    ctx.save();
    for(const s of SATELLITES.list){
      const c=circle.center([s.lon,0])();
      ctx.beginPath(); path(c);
      ctx.fillStyle=SATELLITES.color; ctx.globalAlpha=0.055*alpha; ctx.fill();
      ctx.globalAlpha=0.5*alpha; ctx.strokeStyle=SATELLITES.color; ctx.lineWidth=0.8; ctx.stroke();
      // the point on the ground directly beneath the satellite
      const p=proj([s.lon,0]);
      if(p){
        const rot=proj.rotate();
        if(d3.geoDistance([s.lon,0],[-rot[0],-rot[1]])<1.5533){
          ctx.globalAlpha=0.9*alpha; ctx.beginPath();
          ctx.arc(p[0],p[1],2.2,0,6.2832); ctx.fill();
        }
      }
    }
    ctx.restore(); ctx.globalAlpha=1;
  }

  // ---- on-globe wipe panel ----
  const cmp=document.getElementById('cmp');
  let wipeKey=null, wipeFrac=0.5, wipeBox=null;
  function showWipe(key){
    if(key===wipeKey) return; wipeKey=key; wipeBox=null;
    if(!key){ cmp.classList.remove('on'); dirty=true; return; }
    const c=WIPE[key];
    if(!c){ console.warn('no WIPE entry named "'+key+'"'); cmp.classList.remove('on'); return; }
    wipeFrac=0.5;
    cmp.classList.toggle('broken',!!c.broken);
    const fr=cmp.querySelector('.imgs');
    if(c.img){
      const src=x=>(typeof x==='string' && x.startsWith('photo:')) ? ((window.WMSTORY&&WMSTORY.photos)||{})[x.slice(6)]||'' : x;
      fr.innerHTML='<img class="r" src="'+src(c.img.right)+'" alt="">'+
                   '<div class="clip"><img class="l" src="'+src(c.img.left)+'" alt=""></div>';
      cmp.classList.add('hasimg');
    } else { fr.innerHTML=''; cmp.classList.remove('hasimg'); }
    cmp.querySelector('.note').innerHTML=c.note||'';
    cmp.querySelector('.lab.l').textContent=c.left||'';
    cmp.querySelector('.lab.r').textContent=c.right||'';
    cmp.querySelector('.msg').textContent=c.broken?'no second map to compare against':'';
    cmp.querySelector('input').value=50; syncWipeUI(50);
    cmp.classList.add('on'); dirty=true;
  }
  // position the DOM frame over the projected box each render
  function placeFrame(){
    if(!wipeKey||!WIPE[wipeKey]) return;
    const b=WIPE[wipeKey].box, pts=[];
    for(let i=0;i<=20;i++){
      pts.push([b[0]+(b[2]-b[0])*i/20,b[1]],[b[0]+(b[2]-b[0])*i/20,b[3]],
               [b[0],b[1]+(b[3]-b[1])*i/20],[b[2],b[1]+(b[3]-b[1])*i/20]);
    }
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,any=false;
    const c=proj.rotate(), ctr=[-c[0],-c[1]];
    for(const p of pts){
      if(d3.geoDistance(p,ctr)>1.5533) continue;
      const q=proj(p); if(!q) continue; any=true;
      x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]); y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]);
    }
    if(!any){ cmp.style.display='none'; wipeBox=null; return; }
    cmp.style.display='block';
    const pad = (WIPE[wipeKey] && WIPE[wipeKey].img) ? 0 : 14;
    wipeBox={x:x0-pad,y:y0-pad,w:(x1-x0)+pad*2,h:(y1-y0)+pad*2};
    const r=cv.getBoundingClientRect();
    cmp.style.left=(r.left+wipeBox.x)+'px'; cmp.style.top=(r.top+wipeBox.y)+'px';
    cmp.style.width=wipeBox.w+'px'; cmp.style.height=wipeBox.h+'px';
    cmp.classList.toggle('narrow', wipeBox.w < 200);
    const li=cmp.querySelector('.imgs .clip img'); if(li) li.style.width=wipeBox.w+'px';
  }
  function drawWipe(){
    if(!wipeKey||!WIPE[wipeKey]||!wipeBox) return;
    const c=WIPE[wipeKey];
    if(c.under) { ctx.save(); clipBox(); drawLayer(c.under,1); ctx.restore(); }
    if(c.over && !c.broken){
      ctx.save(); clipBox(wipeBox.x+wipeBox.w*wipeFrac); drawLayer(c.over,1); ctx.restore();
    }
  }
  function clipBox(rightEdge){
    const w=(rightEdge===undefined? wipeBox.w : rightEdge-wipeBox.x);
    ctx.beginPath(); ctx.rect(wipeBox.x,wipeBox.y,w,wipeBox.h); ctx.clip();
  }

  function sh(a,b){ let d=(b-a)%360; if(d>180)d-=360; if(d<-180)d+=360; return a+d; }
  // A camera move (design system, Motion): ease in and out (WM.ease), 0.5 to 1.2 s depending on how far it
  // goes and how much it zooms, along the great circle between the two centres; layers fade over 0.6 s.
  let tween=null;
  function moveTo(t2,msOver){
    if(t2.spin && tgt.spin && t2.base===tgt.base) t2=Object.assign({},t2,{ rot:cur.rot.slice() });
    tgt=t2; dirty=true;
    const c0=[-cur.rot[0],-cur.rot[1]], c1=[-t2.rot[0],-t2.rot[1]], ang=d3.geoDistance(c0,c1);
    const toLens=(t2.mini||0)!==(cur.mini||0);
    let ms=reduce ? 0 : Math.max(500, Math.min(1200, 500 + 700*ang/Math.PI + 250*Math.min(2,Math.abs(Math.log(t2.z/cur.z)))));
    if(toLens && !reduce) ms=Math.max(ms, 900);                // into or out of the corner: about 0.9 s (design system)
    if(msOver && !reduce) ms=msOver;
    tween={ t0:performance.now(), ms, ip:d3.geoInterpolate(c0,c1), z0:cur.z, z1:t2.z, s0:cur.sats||0, a0:Object.assign({},cur.a), m0:cur.mini||0 };
    showPhoto(t2.photo);
    return ms;
  }
  let lastTick=0;
  function tick(){
    const nowT=performance.now(), dtT=lastTick ? Math.min(0.1,(nowT-lastTick)/1000) : 0; lastTick=nowT;
    // a spinning view turns eastward, once no camera move is running (and never with reduced motion)
    let spinning=false;
    if(tgt.spin && !reduce && !exp.on && !tween){
      cur.rot[0]=((cur.rot[0]+tgt.spin*dtT+540)%360)-180; tgt.rot=cur.rot.slice(); spinning=true;
    }
    if(tween){
      const now=performance.now(), f=tween.ms ? Math.min(1,(now-tween.t0)/tween.ms) : 1, e=WM.ease(f);
      const fa=reduce ? 1 : WM.ease(Math.min(1,(now-tween.t0)/600));
      const c=tween.ip(e); cur.rot=[-c[0],-c[1]];
      cur.z=tween.z0*Math.pow(tween.z1/tween.z0,e);
      cur.mini=tween.m0+((tgt.mini||0)-tween.m0)*e;
      cur.sats=tween.s0+((tgt.sats||0)-tween.s0)*fa;
      for(const k in tgt.a){ const a0=tween.a0[k]||0; cur.a[k]=a0+(tgt.a[k]-a0)*fa; }
      render();
      if(f>=1 && fa>=1){ const nx=tween.next; tween=null; cur.rot=tgt.rot.slice(); cur.z=tgt.z; cur.sats=tgt.sats||0; cur.a=Object.assign({},tgt.a); cur.mini=tgt.mini||0; dirty=false; render();
        if(nx) moveTo(nx.t, nx.ms); }                             // a chained move: the slow zoom out of the last slide
    } else if(dirty){
      const e=reduce?1:SETTINGS.easing; let mv=0;
      const dl=sh(cur.rot[0],tgt.rot[0])-cur.rot[0]; cur.rot[0]+=dl*e; mv+=Math.abs(dl);
      const dp=tgt.rot[1]-cur.rot[1]; cur.rot[1]+=dp*e; mv+=Math.abs(dp);
      const dz=tgt.z-cur.z; cur.z+=dz*e; mv+=Math.abs(dz)*90;
      const ds=(tgt.sats||0)-(cur.sats||0); cur.sats=(cur.sats||0)+ds*e; mv+=Math.abs(ds)*90;
      for(const k in tgt.a){ const d=tgt.a[k]-(cur.a[k]||0); cur.a[k]=(cur.a[k]||0)+d*e; mv+=Math.abs(d)*90; }
      render();
      if(mv<.25){ cur.rot=tgt.rot.slice(); cur.z=tgt.z; cur.sats=tgt.sats||0; cur.a=Object.assign({},tgt.a); render(); dirty=false; }
    }
    // storm pulses need a continuous loop of their own
    let anim=false, sweeping=false;
    for(const k in LAYERS){
      if(ISPT[k]==='tracks' && (cur.a[k]||0)>0.02 && LAYERS[k].animate!==false) anim=true;
      if(ISPT[k]==='timeline' && (cur.a[k]||0)>0.02) sweeping=true;
      if(LAYERS[k].flicker && (cur.a[k]||0)>0.02) anim=true;
    }
    if(sweeping){ sweepT=reduce?1:Math.min(1,sweepT+0.0018); if(!reduce) anim=true; }
    if(!sweeping) sweepT=0;
    // slide 1: storm seasons appear one by one, 2006 to 2026, about 0.45 s each
    if(tgt.grow && !reduce){ if(growT<1){ growT=Math.min(1,growT+1/(21*27)); anim=true; } }
    else growT=1;
    const gy=2006+Math.floor(growT*20.999), want=tgt.grow?gy:Infinity;
    if(want!==growYear){ growYear=want; dirty=true;
      const el=slideEl.querySelector('[data-year="grow"]'); if(el) el.textContent=gy; }
    if(performance.now()<animUntil){ anim=true; }
    if(tgt.pulse && !reduce) anim=true;
    if(spinning && !anim){ render(); }
    if(anim && !reduce){ pulse=(pulse+0.0032)%1; render();
      if(panelOpen) syncPanel();
    }
    requestAnimationFrame(tick);
  }

  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting && document.body.dataset.mode!=='explore'){
      const was=tgt.grow; sceneIdx=+en.target.dataset.i; const v=STEPS[sceneIdx].v;
      // a view with zoomFrom arrives zoomed in, then pulls slowly out to its own zoom over `slow` ms
      const camMs = (v.zoomFrom && !reduce) ? moveTo(Object.assign(target(sceneIdx),{ z:v.zoomFrom })) : moveTo(target(sceneIdx));
      if(v.zoomFrom && !reduce && tween) tween.next={ t:target(sceneIdx), ms:v.slow||8000 };
      if(tgt.grow && !was) growT=0;
      const sc=SCENES[STEPS[sceneIdx].s];
      document.body.toggleAttribute('data-flow', !!sc.flow);
      setActivePlugin(sc.plugin && PLUGINS[sc.plugin] && PLUGINS[sc.plugin].draw ? PLUGINS[sc.plugin] : null);
      showWipe(tgt.wipe); showCard(sceneIdx, camMs); dirty=true;
      stepPlugin(sc); }

  // ================= EXPLORE MODE =================

  const panel2=document.getElementById('explore');

  const EXPLORE=[['stations','Weather stations'],['sats_shell','Satellites (positions illustrative)'],['argo','Argo floats'],
    ['gauges','Rain gauges per 1,000 km²'],['storms','Storm tracks, 2006–2026 (animated)'],['fl_deaths','Flood deaths, 2016–2026'],
    ['fl_affected','People affected by floods, 2016–2026'],['telemetry','Animal telemetry (tracked, no sensors)'],['seals','Seal-borne ocean profiles']];
  function buildExploreLayers(){

      const c=LAYERS[k]; if(!c) continue;

  function syncExploreView(){

  function setView(lon,lat,z){
    tween=null;

  ['expLonR','expLatR','expZR'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{

            +document.getElementById('expLatR').value,
            +document.getElementById('expZR').value);

  document.getElementById('expJump').addEventListener('change',e=>{

  function setMode(m){

  // ---------------- the big photo beside the text (design system .wm-figure.is-side) ----------------

  var photoShown=null;
  function showPhoto(id){
    const photoEl=document.getElementById('photo'), photoImg=photoEl.querySelector('img');

  // ---------------- plugins: prototypes drawing on this globe ----------------
  const api={
    canvas:cv, reduce,

  function setActivePlugin(P){

  // drag turns the globe (after 5 px), double-click (or double-tap) goes to the plugin, Ctrl/⌘ + wheel zooms
  { let dg=null, lastTap=null;
    const pt=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };

    cv.addEventListener('pointerup',e=>{ const d=dg; dg=null; if(!activePlugin||exp.on||!d) return;

      if(lastTap && now-lastTap.t<450 && Math.hypot(x-lastTap.x,y-lastTap.y)<26){ lastTap=null; if(activePlugin.doubletap) activePlugin.doubletap(x,y); }
      else lastTap={t:now,x,y}; });
    cv.addEventListener('pointercancel',()=>{ dg=null; lastTap=null; });
    cv.addEventListener('pointerleave',()=>{ if(activePlugin && activePlugin.leave) activePlugin.leave(); });
    cv.addEventListener('dblclick',e=>{ if(!activePlugin||exp.on) return; const [x,y]=pt(e); if(activePlugin.dblclick) activePlugin.dblclick(x,y); });
    cv.addEventListener('wheel',e=>{ if(!activePlugin||exp.on||!(e.ctrlKey||e.metaKey)) return; e.preventDefault(); zoomBy(e.deltaY>0?0.92:1.087); },{passive:false});

  // ---------------- keyboard: one press, one slide ----------------
  // Space, Page Down or Down moves to the next stop (a slide's step, or a prototype
  // section); Shift+Space, Page Up or Up goes back. Keys typed into a field, a tab strip
  // or a focused globe belong to that control, not to the page.
  const hint=document.getElementById('hintbar');
  function stops(){ return [...story.querySelectorAll(':scope > .step, :scope > .mod')]; }
  addEventListener('keydown',e=>{
    if(exp.on || e.metaKey || e.ctrlKey || e.altKey) return;
    const t=e.target, tag=(t.tagName||'').toLowerCase();
    if(/^(input|textarea|select|button|canvas)$/.test(tag) || t.isContentEditable || t.closest('[role=tablist]')) return;
    const fwd = (e.key===' '&&!e.shiftKey) || e.key==='PageDown' || e.key==='ArrowDown';
    const back= (e.key===' '&& e.shiftKey) || e.key==='PageUp'   || e.key==='ArrowUp';
    if(!fwd && !back) return;
    e.preventDefault();
    const S=stops(), y=scrollY, top=el=>el.getBoundingClientRect().top+y, bot=el=>el.getBoundingClientRect().bottom+y;
    // a section taller than the screen: first show the rest of it, then move on
    const here=S.find(el=>top(el)<=y+4 && bot(el)>y+4);
    let dest;
    if(fwd && here && bot(here)>y+innerHeight+4) dest=bot(here)-innerHeight;
    else if(back && here && top(here)<y-4 && bot(here)-innerHeight>=y-4 && top(here)>=y-innerHeight) dest=top(here);
    else if(fwd){ const to=S.find(el=>top(el)>y+4); if(to) dest=top(to); }
    else { const prev=S.filter(el=>top(el)<y-4); const to=prev[prev.length-1]; if(to) dest=Math.max(top(to), bot(to)-innerHeight>top(to)&&bot(to)-innerHeight<y-4 ? bot(to)-innerHeight : top(to)); }
    if(dest!==undefined) scrollTo({top:dest, behavior:reduce?'auto':'smooth'});
  });
  addEventListener('scroll',()=>hint.classList.toggle('is-done', scrollY > innerHeight*0.5),{passive:true});

  const prog=document.getElementById('progress');
  function updateProgress(){
    const max=document.documentElement.scrollHeight-innerHeight;
    prog.style.width=(max>0 ? (scrollY/max)*100 : 0)+'%';
  }
  addEventListener('scroll',updateProgress,{passive:true});
  addEventListener('resize',updateProgress); updateProgress();

  resize(); requestAnimationFrame(tick);
 } catch(err){
   document.body.style.background = '#05080E';
   document.body.innerHTML =
     '<pre style="color:#F07A55;font:13px/1.6 ui-monospace,monospace;padding:2rem;white-space:pre-wrap">'
     + 'Something in the config is wrong:\n\n' + err.message + '\n\n' + (err.stack || '')
     + '</pre>';
   console.error(err);
 }
}
