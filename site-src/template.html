<script id="CONFIG">

// ---------------------------------------------------------------------------
// 1. LAYERS — one entry per dataset. Colour and label are yours to change.
//    power : how strongly density turns into brightness. 0.5 to 1.0.
//    size  : dot size multiplier. 1 is default. Below 1 gives fine speckle,
//            which is what you want for dense layers like the flood maps.
//    floor : how bright the faintest cell is, 0 to 1. Lower = cleaner, darker
//            sparse areas. 0.13 is the default; try 0.02 for dense layers.
//    gain  : how fast brightness saturates. 7 is default; lower = more range.
// ---------------------------------------------------------------------------
const LAYERS = {
  stations:  { label:'Weather stations',        color:'#FFB547', power:0.85 },
  usable:    { label:'30-year records',         color:'#FFB547', power:0.85 },
  years:     { label:'Stations by record length', color:'#FFD08A', power:0.85 },
  argo:      { label:'Argo floats',             color:'#45B0CE', power:0.85 },
  seals:     { label:'Seal profiles',           color:'#6FD8B4', power:0.85 },
  sharks:    { label:'Shark profiles',          color:'#F07A55', power:0.85 },
  telemetry: { label:'Tracked, no sensors',     color:'#B98CE0', power:0.85 },
  // These two are plain dot layers, not density grids. dot = radius in pixels
  // at normal zoom, alpha = opacity. Light and crisp, no density maths.
  fema:      { label:'FEMA flood exposure',     color:'#FFFFFF', dot:1.25, alpha:0.92 },
  aiextra:   { label:'Model-added exposure',    color:'#4FC3F7', dot:1.55, alpha:0.98 },
  xx_before: { label:'Settlements before',      color:'#E05CC8', dot:0.75, alpha:0.95 },
  xx_lost:   { label:'Settlements gone',        color:'#FF3D6E', dot:0.95, alpha:1.00 },
  xx_water:  { label:'Floodwater',              color:'#2E6FA3', dot:0.85, alpha:0.80 },
  // one dot per 1-degree cell inside an Argo coldspot patch
  coldspots: { label:'Argo coldspots',          color:'#E4EEFF', dot:0.9,  alpha:0.85 },
  // Sendai Target G-1: one dot per country reporting a multi-hazard early
  // warning system, dots filling each country on a 1-degree grid. See
  // scripts/fetch_sendai_g1.py and scripts/add_mhews_layers.py.
  // Layers draw in the order listed, so 2025 comes first: with both on, the
  // 2022 dots sit on top and only the countries added since show orange.
  mhews_2025:{ label:'Reported having MHEWS, 2025', color:'#F08A3E', dot:1.1, alpha:0.95 },
  mhews_2022:{ label:'Reported having MHEWS, 2022', color:'#F5D04A', dot:1.1, alpha:0.95 },
  // leatherback + loggerhead cells from OBIS. See scripts/add_turtles_layer.py.
  turtles:   { label:'Leatherback and loggerhead turtles', color:'#C6E377', dot:1.4, alpha:0.9 },

  // storm tracks. ramp runs tropical storm -> cat 5, yellow -> red.
  storms:    { label:'Storm tracks 2006-2026',   ramp:['#F5E06A','#F6C243','#F09A3E','#E8703E','#DC4340','#B81D2C'], width:0.9, alpha:0.55, animate:true },
  michael:   { label:'Hurricane Michael 2018',   ramp:['#FFFFFF'], width:2.4, alpha:1, animate:true },
  haiyan:    { label:'Typhoon Haiyan 2013',      ramp:['#FFFFFF'], width:2.4, alpha:1, animate:true },

  // EM-DAT flood impacts, drawn as proportional circles
  fl_affected:{ label:'People affected',         color:'#F2C744', bubble:34, alpha:0.28 },
  fl_deaths:  { label:'Deaths',                  color:'#E8433F', bubble:13, alpha:0.80 },
  fl_damage:  { label:'Damage (US$)',            color:'#5BC8A8', bubble:30, alpha:0.32 },

  sats_shell: { label:'Satellites',              color:'#CBD6E2', dot:1.5, alpha:0.9 },
  st_decay:   { label:'Stations, switching off', color:'#FFB547', dot:0.9, alpha:0.9, sweep:true }
};

// ---------------------------------------------------------------------------
// 1b. SATELLITES — the operational geostationary weather satellites.
//     Each one parks over a fixed longitude at 35,786 km and watches the same
//     circle of Earth forever. "reach" is how far from directly below it the
//     imagery stays usable, in degrees. 65 is the usual working limit;
//     the geometric horizon is 81 but the view there is uselessly oblique.
//     Set reach to 81 to show the horizon instead.
// ---------------------------------------------------------------------------
const SATELLITES = {
  reach: 65,
  color: '#E8E6E1',
  list: [
    { name:'GOES-19 (East)',  lon: -75.2, operator:'NOAA' },
    { name:'GOES-18 (West)',  lon:-137.2, operator:'NOAA' },
    { name:'Meteosat',        lon:   0.0, operator:'EUMETSAT' },
    { name:'Meteosat IODC',   lon:  45.5, operator:'EUMETSAT' },
    { name:'INSAT-3D',        lon:  82.0, operator:'ISRO' },
    { name:'FengYun-4',       lon: 105.0, operator:'CMA' },
    { name:'GK-2A',           lon: 128.2, operator:'KMA' },
    { name:'Himawari-9',      lon: 140.7, operator:'JMA' }
  ]
};

// ---------------------------------------------------------------------------
// 1c. WIPE — a framed panel drawn straight onto the globe, with a draggable
//     divider. "under" is always visible; "over" only shows left of the handle.
//     box is the geographic rectangle to frame: [west, south, east, north].
//     Set broken:true and the handle locks — for when there is nothing to reveal.
// ---------------------------------------------------------------------------
const WIPE = {

  us: {
    box   : [-125, 24, -66, 50],
    under : 'fema',
    over  : 'aiextra',
    left  : 'Official FEMA flood map',
    right : 'After the model fills the gaps',
    note  : '11.04 million more people and 4.12 million more buildings in flood zones than the federal map records \u2014 a 69% and 81% increase. Wu, Zhang &amp; Stouffs, Nature Communications 17:5983 (2026).'
  },

  xaixai: {
    box   : [32.936, -25.352, 33.951, -24.380],   // the exact footprint of the two images
    img   : { left:IMG.xxBefore, right:IMG.xxAfter },
    over  : 'xx_lost',                            // red dots ride on top of the imagery
    left  : 'Before',
    right : 'After the flood',
    left  : 'Before',
    right : 'After the flood',
    note  : 'Lower Limpopo valley around Xai-Xai, Chibuto, Chokwe and Macia. Magenta is built-up ground; blue is standing water. 55% of the settled area in this frame is under water on the later date. Less than a tenth of the water arriving here is generated inside Mozambique.'
  },

  mozambique: {
    box    : [30, -27, 41, -10],
    under  : null,
    over   : null,
    broken : true,
    left   : 'Official national flood map',
    right  : 'Model output',
    note   : 'Nothing to wipe between. Mozambique has no national flood hazard map, so the model has nothing to learn from and nothing to be checked against.'
  }

};

// ---------------------------------------------------------------------------
// 2. SCENES — the whole story, in order. One object per scroll step.
//
//    center : [longitude, latitude]  where the globe points. Just type the
//             real coordinates you want to look at. West and south are negative.
//    zoom   : 1 is normal. 1.5 is closer. 0.8 is further away.
//    layers : which layers are visible and how strongly, 0 to 1.
//             Leave a layer out entirely and it's off.
//    sats   : 0 to 1. How strongly to draw the geostationary footprints.
//             Leave it out and they're off.
//    wipe   : the name of an entry in WIPE, to frame a region and add a handle.
//    quote  : true renders the text large and bare, with no box. For pull quotes.
//    bare   : true removes the box but keeps normal size. For narration.
//    photo  : { src, tint } shows a square image above the card, tinted to match
//             the layer it belongs to. Put your own file next to this HTML and
//             write src:'seal.jpg', or use one of the embedded PHOTO entries.
//    legend : usually automatic from the visible layers. Pass an array of layer
//             names to override, or false to hide it.
//    html   : the text card. Plain HTML between the backticks.
//
//    To add a scene, copy any block and paste it where you want it.
//    To remove one, delete it. To reorder, move it.
// ---------------------------------------------------------------------------
const SCENES = [

  // 1
  { center:[-40, 12], zoom:0.86, layers:{}, bare:true,
    html:`<div class="ttl big">The Gaps in the Weather Machine</div>
          <div class="sub">Who can see the storm coming, and who can't</div>
          <p>For most of history we could only guess at the weather. We prayed, consulted
             oracles and made calendars. None of it worked.</p>` },

  // 2
  { center:[10, 45], zoom:1.05, layers:{ stations:0.7 }, bare:true,
    html:`<div class="ttl">Weather stations</div>
          <div class="sub">Since the 1800s</div>
          <p>Then we started to <span style="color:#FFB547">measure</span>.</p>` },

  // 3
  { center:[30, 12], zoom:0.68, sats:0, layers:{ sats_shell:1, stations:0.25 }, bare:true,
    html:`<div class="ttl">Satellites</div>
          <div class="sub">Since 1960</div>
          <p>They watch from above, but cannot measure the air two metres off the ground,
             where crops grow and people live.</p>` },

  // 4
  { center:[-150, 0], zoom:0.88, layers:{ argo:1, stations:0.2 },
    html:`<div class="ttl">Argo floats</div>
          <span class="stat float">3,375,214</span>
          <span class="note">ocean profiles from 20,530 floats, since 1999</span>
          <p>Floats drift through the oceans measuring temperature and salinity.</p>` },

  // 5
  { center:[20, 10], zoom:0.9, quote:true, layers:{ stations:1, argo:0.3 },
    html:`<div class="ttl">An uneven machine</div>
          <div class="sub">Coverage is not shared equally</div>
          <p>We built a machine to watch the weather.</p>
          <p>But not all places have the same view of the storm.</p>` },

  // 6
  { center:[-98, 39], zoom:1.8, layers:{ stations:1 },
    html:`<div class="ttl">The United States</div>
          <span class="stat lamp">76,708</span>
          <span class="note">weather stations, 59% of all on Earth</span>
          <p>So many they merge into a solid surface. Most are new: 51,229 are volunteer
             rain gauges put up since 1998.</p>` },

  // 7
  { center:[20, 2], zoom:1.6, layers:{ stations:1 },
    html:`<div class="ttl">Africa</div>
          <span class="stat lamp">2,166</span>
          <span class="note">weather stations across the continent</span>
          <p>Same layer, one turn east. Africa's stations are old, with a median record of
             68 years against 8 in the US. The network is shrinking, not growing.</p>` },

  // 8
  { center:[-96, 38], zoom:2.45, wipe:'us', layers:{}, bare:true,
    html:`<div class="ttl">Where data is rich</div>
          <div class="sub">AI fills the gaps</div>
          <p>Drag the handle. Trained on FEMA's flood maps, a model found
             <strong>11 million people</strong> and <strong>4.1 million buildings</strong>
             in flood zones no official map had recorded.</p>` },

  // 9
  { center:[35, -18], zoom:2.45, wipe:'mozambique', layers:{ stations:1 }, bare:true,
    html:`<div class="ttl">Where data is poor</div>
          <div class="sub">It can't</div>
          <p>Mozambique has no national flood map, so the handle doesn't move. AI makes
             the best-measured places better measured.</p>` },

  // 10
  { center:[14, 8], zoom:0.92, quote:true, layers:{ stations:0.35 },
    html:`<div class="ttl">The cost</div>
          <div class="sub">Two storms, two outcomes</div>
          <p>So what happens to a place that can't see the weather coming?</p>` },

  // 11
  { center:[-86, 29], zoom:3.0, layers:{ michael:1, storms:0.18, stations:0.5 }, bare:true,
    html:`<div class="ttl">Hurricane Michael</div>
          <div class="sub">Florida, 2018 &middot; 125 knots</div>
          <p>Tracked for days, warned, evacuated. <strong>74 people died.</strong></p>` },

  // 12
  { center:[125, 11], zoom:3.0, layers:{ haiyan:1, storms:0.18 }, bare:true,
    html:`<div class="ttl">Typhoon Haiyan</div>
          <div class="sub">Philippines, 2013 &middot; 125 knots</div>
          <p><strong>6,352 people died.</strong> Another 1,071 were never found.</p>
          <p>Measured in money, Michael was the bigger disaster: $25.5 billion against
             $2.98 billion.</p>` },

  // 13
  { center:[24, 4], zoom:1.05, layers:{ stations:0.9 },
    html:`<div class="ttl">The warning gap</div>
          <span class="stat lamp">636 vs 37</span>
          <span class="note">weather radars: US and EU vs Africa</span>
          <p>Roughly the same population. 24 hours of warning cuts disaster damage by
             about 30%, but you need instruments to give it.</p>` },

  // 14
  { center:[35, -18], zoom:2.6, layers:{ stations:1, argo:0.5, coldspots:0.6 },
    html:`<div class="ttl">Mozambique</div>
          <span class="stat lamp">19</span>
          <span class="note">weather stations for 34 million people</span>
          <p>Offshore, the Mozambique Channel gets a third of the global average of Argo
             profiles. Upstream, most of the water that floods the Limpopo flows past
             gauges Mozambique doesn't own.</p>` },

  // 15
  { center:[33.44, -24.87], zoom:52, wipe:'xaixai', layers:{}, bare:true,
    html:`<div class="ttl">Xai-Xai</div>
          <div class="sub">The lower Limpopo, before and after</div>
          <p>Drag the handle. <strong>55% of the built-up area in this frame ends up
             underwater.</strong></p>` },

  // 16
  { center:[30, 14], zoom:0.86, layers:{ fl_affected:1, fl_deaths:1 },
    html:`<div class="ttl">Who dies</div>
          <div class="sub">Every flood recorded since 2016</div>
          <p><span style="color:#F2C744">Yellow</span> is people affected,
             <span style="color:#E8433F">red</span> people killed. Africa has 27% of the
             deaths. Europe has 1.5%.</p>` },

  // 17
  { center:[22, 0], zoom:1.2, layers:{ stations:0.8 },
    html:`<div class="ttl">Getting worse</div>
          <span class="stat lamp">&minus;50%</span>
          <span class="note">African weather balloon reports, 2015 to 2020</span>
          <p>The poorest countries and small island states have 9% of the surface
             stations the WMO says they need, and 13% of the upper-air ones.</p>` },

  // 18
  { center:[14, 12], zoom:0.88, quote:true, layers:{ stations:0.25 },
    html:`<div class="ttl">Early warning works</div>
          <div class="sub">Ant&oacute;nio Guterres, UN Secretary-General, 2025</div>
          <p>&ldquo;Disaster-related mortality is at least six times lower in countries
             with good early-warning systems in place.&rdquo;</p>` },

  // 19
  { center:[14, 10], zoom:0.9, layers:{ mhews_2022:1 },
    html:`<div class="ttl">Early warning, 2022</div>
          <span class="stat" style="color:#F5D04A">85</span>
          <span class="note">countries with a multi-hazard system</span>
          <p>Fewer than half the world's countries.</p>` },

  // 20
  { center:[14, 10], zoom:0.9, layers:{ mhews_2025:1, mhews_2022:1 },
    html:`<div class="ttl">Early warning, 2025</div>
          <span class="stat warn">105</span>
          <span class="note">countries, <span style="color:#F08A3E">orange</span> added since 2022</span>
          <p>The map is filling in, but slowly.</p>` },

  // 21
  { center:[20, -5], zoom:1.3, layers:{ stations:0.7 }, bare:true,
    html:`<div class="ttl">Sharing</div>
          <div class="sub">Required since 2021</div>
          <p>All 193 WMO members must now share basic weather observations. And
             scientists are finding cheaper ways to collect the data.</p>` },

  // 22
  { center:[30, -70], zoom:1.0, layers:{ seals:1, argo:0.45 },
    photo:{ src:PHOTO.seal, tint:'#6FD8B4' },
    html:`<div class="ttl">Seals</div>
          <span class="stat seal">74%</span>
          <span class="note">of ocean profiles south of 65&deg;S</span>
          <p>Floats get trapped under sea ice. Elephant seals carrying sensors dive under
             it anyway. Nobody planned this network.</p>` },

  // 23
  { center:[-68, 34], zoom:1.3, layers:{ sharks:1, argo:0.35, seals:0.3 },
    html:`<div class="ttl">Sharks</div>
          <span class="stat shark">40%</span>
          <span class="note">lower forecast error in the Gulf Stream</span>
          <p>29 tagged sharks swam through shallow water Argo avoids. No new satellites.
             No new budget.</p>` },

  // 24
  { center:[0, 6], zoom:0.86, layers:{ telemetry:1, seals:0.35, sharks:0.55, argo:0.25 },
    html:`<div class="ttl">We already track animals</div>
          <span class="stat tele">315</span>
          <span class="note">marine species tracked around the world, none carrying sensors</span>
          <p>Whales, turtles, seabirds and sharks, followed for conservation. The tags
             report where the animal is, and nothing about the water around it.</p>` },

  // 25
  { center:[32, -14], zoom:1.35, layers:{ coldspots:1, turtles:1, argo:0.35, stations:0.4 },
    html:`<div class="ttl">Can we do the same for Mozambique?</div>
          <div class="sub">The Mozambique Channel is an Argo coldspot</div>
          <p>Floats sample it at a third of the global average, and no seal has been
             tagged there. But leatherback and loggerhead turtles already migrate through
             it. Add a sensor and the same tag closes an ocean data gap.</p>` },

  // 26
  { center:[20, 5], zoom:1.1, layers:{ stations:0.6 }, bare:true,
    html:`<div class="ttl">The limits</div>
          <div class="sub">Clever fixes are cheap</div>
          <p>But animals can't measure rainfall over Ch&oacute;kw&egrave;, or give a
             district 30 years of records to size a drain. The boring things still have
             to be paid for.</p>` },

  // 27
  { center:[10, 16], zoom:0.84, layers:{ stations:0.15 },
    html:`<div class="ttl">The money exists</div>
          <span class="stat" style="color:#4FC3F7">$2.7 trillion</span>
          <span class="note">worldwide spending on AI in 2026</span>
          <p>The UN's plan to put every person on Earth under an early warning system
             costs $3.1 billion over five years: less than half a day of AI
             spending.</p>` },

  // 28
  { center:[6, 14], zoom:0.82, quote:true, layers:{ stations:0.2, argo:0.2, seals:0.3, sharks:0.4, telemetry:0.5 },
    html:`<div class="ttl">What computation is for</div>
          <div class="sub">Benjamin Bratton, Planetary Sapience</div>
          <p>&ldquo;In its current commercial form, the primary purpose of planetary-scale
             computation is to measure and model individual people in order to predict
             their next impulse. But a more aspirational goal would be to contribute to
             the comprehension, composition and enforcement of a shared future that is
             more rich, diverse and viable.&rdquo;</p>` },

  // 29 — ending
  { center:[6, 14], zoom:0.82, quote:true, layers:{ stations:0.55, argo:0.3, seals:0.3, sharks:0.3, turtles:0.4 },
    html:`<div class="ttl">What we need</div>
          <div class="sub">Essential infrastructure</div>
          <p><span style="color:#FFB547">Dams.<br>Weather stations.<br>Radiosondes.<br>Seawalls.</span></p>` }

];

const SETTINGS = {

  #explore .tip{color:#6B7684; font-size:11.5px; line-height:1.5; margin-top:1.4rem}

  body[data-mode="explore"] #explore{display:block}
  body[data-mode="explore"] #topbar{padding-left:var(--pad-x)}
  body[data-mode="explore"] #story,
  body[data-mode="explore"] #cardhost,
  body[data-mode="explore"] #hintbar,
  body[data-mode="explore"] #cmp{display:none !important}
  body[data-mode="explore"] #globe{cursor:grab}
  body[data-mode="explore"] #globe:active{cursor:grabbing}

  #stage{position:fixed; inset:0; z-index:0}
  #globe{width:100%; height:100%; display:block}
  main{position:relative; z-index:1}
  /* scroll sections are now just triggers; the card is pinned on screen */
  .step{height:100vh}
  #cardhost{position:fixed; z-index:2; left:4vw; top:50%; transform:translateY(-50%);
       width:min(62ch,47vw); pointer-events:none}
  #cardhost .inner{opacity:0; transform:translateY(10px);
       transition:opacity .42s ease, transform .42s ease}
  #cardhost.on .inner{opacity:1; transform:none}
  .card{padding:1.7rem 1.85rem; border:1px solid; border-radius:3px;
        backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
        max-height:78vh; overflow-y:auto; pointer-events:auto}
  .card.bare, .card.quote{background:none !important; border:none; padding:0;
        backdrop-filter:none; -webkit-backdrop-filter:none; overflow:visible}
  .card.bare p{font-size:1.16rem; line-height:1.55;
        text-shadow:0 2px 22px rgba(5,8,14,.95), 0 0 56px rgba(5,8,14,.8)}
  .card.bare .stat{text-shadow:0 2px 22px rgba(5,8,14,.95)}
  .card p{margin:0 0 .9em} .card p:last-child{margin-bottom:0}
  .stat{font-family:var(--disp); font-weight:500; font-size:clamp(1.7rem,3.8vw,2.6rem);
        line-height:1; letter-spacing:-.02em; display:block; margin-bottom:.32rem}
  .note{font-size:.93rem; display:block; margin-bottom:1.15rem}
  /* every scene opens with a title and a short subtitle */
  .ttl{font-family:var(--disp); font-weight:500; font-size:1.3rem; line-height:1.2;
       letter-spacing:-.01em; color:#ECEAE5; margin:0 0 .3rem}
  .ttl.big{font-size:clamp(1.9rem,3.4vw,2.7rem); line-height:1.08; letter-spacing:-.02em;
       margin-bottom:.55rem}
  .sub{font-size:.92rem; color:#8B95A1; margin:0 0 1rem}
  .ttl + .stat{margin-top:.55rem}
  .card.bare .ttl, .card.quote .ttl, .card.bare .sub, .card.quote .sub{
       text-shadow:0 2px 22px rgba(5,8,14,.95), 0 0 56px rgba(5,8,14,.8)}
  .card.quote .sub{margin-bottom:1.3rem}

  /* control panel */
  #panel{position:fixed; top:0; right:0; bottom:0; width:320px; z-index:10;
    background:#0A0E15; border-left:1px solid #222C38; color:#ECEAE5;
    font:13px/1.5 var(--sans); padding:1rem 1.1rem; overflow-y:auto;
    transform:translateX(100%); transition:transform .25s ease}
  #panel.open{transform:none}
  #panel h4{font-family:var(--disp); font-weight:500; margin:0 0 .2rem; font-size:.95rem}
  #panel .hint{color:#8B95A1; font-size:11.5px; margin:0 0 1.1rem}
  #panel .grp{border-top:1px solid #1B2531; padding:.85rem 0}
  #panel label{display:block; color:#8B95A1; font-size:11.5px; margin:.55rem 0 .15rem}
  #panel input[type=range]{width:100%; margin:0}
  #panel .row{display:flex; align-items:center; gap:.5rem; margin:.35rem 0}
  #panel .row input[type=checkbox]{margin:0}
  #panel .row span{flex:1}
  #panel .row .val{color:#8B95A1; font-variant-numeric:tabular-nums; font-size:11px}
  #panel input[type=color]{width:26px; height:18px; padding:0; border:none; background:none}
  #panel button{width:100%; padding:.5rem; margin-top:.5rem; cursor:pointer;
    background:none; color:#ECEAE5; border:1px solid rgba(236,234,229,.35);
    border-radius:2px; font:12px var(--sans); transition:background .15s,border-color .15s}
  #panel button:hover{background:rgba(236,234,229,.08); border-color:#ECEAE5}
  #panel pre{background:#05080E; border:1px solid #1B2531; padding:.6rem; border-radius:3px;
    font-size:11px; overflow-x:auto; color:#9FB3C8; margin:.5rem 0 0; white-space:pre-wrap}

  /* ---- controls: one consistent set, white outlines throughout ---- */
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:16px;
    background:transparent; cursor:pointer; margin:.15rem 0 .55rem}
  input[type=range]::-webkit-slider-runnable-track{
    height:1px; background:rgba(236,234,229,.26); border-radius:0}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:11px; height:11px; margin-top:-5px;
    border-radius:50%; background:#05080E; border:1.4px solid #ECEAE5; transition:background .15s}
  input[type=range]:hover::-webkit-slider-thumb,
  input[type=range]:focus-visible::-webkit-slider-thumb{background:#ECEAE5}
  input[type=range]::-moz-range-track{height:1px; background:rgba(236,234,229,.26)}
  input[type=range]::-moz-range-thumb{width:10px; height:10px; border-radius:50%;
    background:#05080E; border:1.4px solid #ECEAE5}
  input[type=range]:disabled{opacity:.3; cursor:default}

  input[type=checkbox]{
    -webkit-appearance:none; appearance:none; width:13px; height:13px; flex:none;
    border:1px solid rgba(236,234,229,.42); border-radius:2px; background:transparent;
    cursor:pointer; position:relative; margin:0; transition:border-color .15s}
  input[type=checkbox]:hover{border-color:#ECEAE5}
  input[type=checkbox]:checked{background:#ECEAE5; border-color:#ECEAE5}
  input[type=checkbox]:checked::after{content:''; position:absolute; left:4px; top:1px;
    width:3px; height:7px; border:solid #05080E; border-width:0 1.6px 1.6px 0;
    transform:rotate(45deg)}

  select{-webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23ECEAE5' stroke-width='1.3'/></svg>");
    background-repeat:no-repeat; background-position:right .6rem center; padding-right:1.6rem !important}

  input[type=color]{-webkit-appearance:none; appearance:none; border:1px solid rgba(236,234,229,.35);
    border-radius:2px; padding:0; background:none; cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:1px}
  input[type=color]::-webkit-color-swatch{border:none; border-radius:1px}

  /* ---- scrollbars: a thin white line ---- */
  html{scrollbar-width:thin; scrollbar-color:rgba(236,234,229,.3) transparent}
  ::-webkit-scrollbar{width:5px; height:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(236,234,229,.28); border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(236,234,229,.6)}
  ::-webkit-scrollbar-corner{background:transparent}

  /* progress through the story, along the top edge */
  #progress{position:fixed; top:0; left:0; height:1px; width:0; z-index:7;
    background:#ECEAE5; opacity:.85; pointer-events:none; transition:width .12s linear}
  body[data-mode="explore"] #progress{display:none}

  /* pull quotes: no box, large type. Width comes from #cardhost; a ch max-width
     here would be measured in the small body font and squeeze the big type. */
  .card.quote p{font-family:var(--disp); font-weight:500;
       line-height:1.24; letter-spacing:-.018em;
       text-shadow:0 2px 26px rgba(5,8,14,.96), 0 0 70px rgba(5,8,14,.85)}
  .card.q-s{max-width:38vw}
  .card.q-s p{font-size:clamp(1.5rem,3.2vw,2.4rem)}
  .card.q-m{max-width:38vw}
  .card.q-m p{font-size:clamp(1.2rem,2.2vw,1.7rem); line-height:1.28}
  .card.q-l{max-width:40vw}
  .card.q-l p{font-size:clamp(1rem,1.7vw,1.35rem); line-height:1.38; letter-spacing:-.008em}
  .card.quote p.src{font-family:var(--sans); font-weight:400;
       font-size:.9rem; letter-spacing:0; margin-top:1.15rem; text-shadow:none;
       line-height:1.6; max-width:46ch}

  /* square instrument photo, duotoned to the layer colour */
  .photo{width:132px; height:132px; border-radius:2px; overflow:hidden;
       position:relative; margin:0 0 1rem}
  .photo img{width:100%; height:100%; object-fit:cover; display:block;
       filter:grayscale(1) contrast(1.12) brightness(1.05); mix-blend-mode:luminosity}

  /* per-scene legend */
  .legend{display:flex; flex-wrap:wrap; gap:.55rem 1.05rem; margin-top:1rem;
       font-size:.78rem; color:#8B95A1; letter-spacing:.01em}
  .legend span{display:inline-flex; align-items:center; gap:.4rem}
  .legend i{width:9px; height:9px; border-radius:50%; flex:none}
  .legend i.line{width:14px; height:3px; border-radius:2px}

  /* on-globe wipe frame */
  #cmp{position:fixed; z-index:2; opacity:0; pointer-events:none; display:none;
       transition:opacity .45s ease; border:1px solid rgba(236,234,229,.7); border-radius:2px}
  #cmp.on{opacity:1; pointer-events:auto}
  #cmp .bar{position:absolute; top:-1px; bottom:-1px; width:2px; background:#ECEAE5; left:50%;
       transform:translateX(-1px)}
  #cmp .knob{position:absolute; top:50%; left:50%; width:26px; height:26px; margin:-13px 0 0 -13px;
       border-radius:50%; background:#ECEAE5; color:#05080E; display:flex; align-items:center;
       justify-content:center; font:13px/1 var(--sans); cursor:ew-resize; user-select:none}
  #cmp input[type=range]{position:absolute; inset:0; width:100%; height:100%; opacity:0;
       cursor:ew-resize; margin:0}
  #cmp .lab{position:absolute; top:100%; margin-top:6px; font:11px var(--sans);
       color:#ECEAE5; white-space:nowrap; opacity:.9}
  #cmp .lab.l{left:0} #cmp .lab.r{right:0}
  #cmp.narrow .lab{display:none}
  #cmp .msg{position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
       text-align:center; font:11.5px var(--sans); color:#7C8794}
  #cmp .note{position:absolute; left:0; right:0; top:100%; margin:1.7rem 0 0;
       font:11px/1.5 var(--sans); color:#8B95A1}
  #cmp .imgs{position:absolute; inset:0; overflow:hidden}
  #cmp .imgs img{position:absolute; inset:0; width:100%; height:100%;
       object-fit:fill; display:block; image-rendering:auto}
  #cmp .imgs .clip{position:absolute; inset:0; overflow:hidden; width:50%}
  #cmp .imgs .clip img{width:auto; height:100%; max-width:none}
  #cmp.broken .knob{background:#3A4450; color:#8B95A1; cursor:not-allowed}
  #cmp.broken .bar{background:#3A4450}
  #cmp.broken input[type=range]{pointer-events:none}
  #yearTag{position:fixed; right:5vw; top:12vh; z-index:3; pointer-events:none;
     font:500 clamp(2.2rem,6vw,4.6rem)/1 var(--disp); color:#FFB547; opacity:0;
     transition:opacity .4s ease; font-variant-numeric:tabular-nums}
  #hintbar{position:fixed; left:12px; bottom:12px; z-index:9; color:#8B95A1;
    font:11.5px var(--sans); opacity:.6}

  @media (max-width:760px){
    body{font-size:16px}
    #stage{position:fixed; top:0; left:0; right:0; height:50vh; bottom:auto}
    #cardhost{left:5vw; right:5vw; width:auto; top:auto; bottom:4vh; transform:none}
    #explore{width:100%; border-right:none}
    #topbar{padding:.7rem 5vw}
    body[data-mode="explore"] #topbar{padding-left:var(--pad-x)}
    .card{max-height:42vh}
    .card.q-s, .card.q-m, .card.q-l{max-width:none}
    .card.q-s p{font-size:clamp(1.4rem,6vw,1.9rem)}
    .card.q-l p{font-size:1.02rem}
    #panel{width:100%; }
  }
  @media (prefers-reduced-motion:reduce){ .card{transition:none} }
</style>

<div id="progress"></div>
<header id="topbar">
  <span class="brand">The Gaps in the Weather Machine</span>
  <nav>
    <button id="navStory" class="on">Story</button>
    <button id="navExplore">Explore</button>
  </nav>
</header>

<div id="stage"><canvas id="globe"></canvas></div>

<aside id="explore">
  <h3>Layers</h3>
  <div id="expLayers"></div>
  <h3>View</h3>
  <div class="row"><label>Longitude</label><output id="expLon"></output></div>
  <input type="range" id="expLonR" min="-180" max="180" step="1">
  <div class="row"><label>Latitude</label><output id="expLat"></output></div>
  <input type="range" id="expLatR" min="-90" max="90" step="1">
  <div class="row"><label>Zoom</label><output id="expZ"></output></div>
  <input type="range" id="expZR" min="0.6" max="60" step="0.1">
  <h3>Jump to</h3>
  <select id="expJump">
    <option value="">&mdash;</option>
    <option value="-40,12,0.86">Whole Earth</option>
    <option value="-98,39,1.9">United States</option>
    <option value="20,2,1.6">Africa</option>
    <option value="10,50,3.2">Europe</option>
    <option value="110,15,1.7">South and East Asia</option>
    <option value="30,-70,1.1">Antarctica</option>
    <option value="-68,34,1.4">Gulf Stream</option>
    <option value="33.44,-24.87,52">Lower Limpopo</option>
  </select>
  <button id="expReset">Reset view</button>
  <p class="tip">Drag the globe to spin it. Scroll or pinch to zoom.</p>
</aside>
<div id="cardhost"><div class="inner"></div></div>
<main id="story"></main>
<div id="cmp">
  <div class="imgs"></div>
  <div class="bar"></div><div class="knob">&#8596;</div>
  <span class="lab l"></span><span class="lab r"></span>
  <span class="msg"></span>
  <input type="range" min="2" max="98" value="50" aria-label="wipe between maps">
  <p class="note"></p>
</div>
<aside id="panel"></aside>
<div id="yearTag"></div>
<div id="hintbar">press D for controls</div>

<!-- ======================= ENGINE — you shouldn't need to edit ============= -->
<script id="ENGINE">
function START(){
 try {
  const cv=document.getElementById('globe'), ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // apply LOOK
  document.body.style.background=LOOK.background;
  document.body.style.color=LOOK.text;
  const sheet=document.createElement('style');
  sheet.textContent=`.card{background:${LOOK.cardBg};border-color:${LOOK.cardBorder}}
    .note,.card em{color:${LOOK.textMuted}}`;
  document.head.appendChild(sheet);

  // live state, editable from the panel
  const live={ layers:{}, look:Object.assign({},LOOK) };
  for(const k in LAYERS) live.layers[k]=Object.assign({},LAYERS[k]);

  function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

  function decode(L){
    const st=L.s,N=Math.round(360/st),la0=Math.round(90/st),lo0=Math.round(180/st);
    const out=new Float32Array(L.n.length*3); let idx=0;
    for(let i=0;i<L.n.length;i++){ idx+=L.d[i];
      const la=Math.floor(idx/N)-la0, lo=idx-(la+la0)*N-lo0;
      out[i*3]=lo*st+st/2; out[i*3+1]=la*st+st/2; out[i*3+2]=L.n[i]; }
    return out;
  }
  const L={}, MAXN={}, ISPT={};
  for(const k in LAYERS){
    if(!DATA[k]){ console.warn('no data for layer "'+k+'"'); continue; }
    if(DATA[k].type==='points'){ L[k]=Float32Array.from(DATA[k].xy); ISPT[k]=true; continue; }
    if(DATA[k].type==='tracks'||DATA[k].type==='bubbles'||DATA[k].type==='shell'||DATA[k].type==='timeline'){
      L[k]=DATA[k]; ISPT[k]=DATA[k].type; continue; }
    L[k]=decode(DATA[k]); let m=0;
    for(let i=2;i<L[k].length;i+=3) if(L[k][i]>m)m=L[k][i];
    MAXN[k]=m;
  }

  // build the scroll sections from SCENES
  const story=document.getElementById('story');
  function legendFor(s){
    if(s.legend===false || s.quote) return '';
    let keys = Array.isArray(s.legend) ? s.legend
      : Object.keys(s.layers||{}).filter(k=>(s.layers[k]||0)>=0.5 && LAYERS[k]);
    if(!keys.length) return '';
    return '<div class="legend">'+keys.map(k=>{
      const c=LAYERS[k]; if(!c) return '';
      const col = c.color || (c.ramp && c.ramp[c.ramp.length-1]) || '#ECEAE5';
      const cls = c.ramp ? ' class="line"' : '';
      return '<span><i'+cls+' style="background:'+col+'"></i>'+c.label+'</span>';
    }).join('')+'</div>';
  }
  const host=document.getElementById('cardhost'), inner=host.querySelector('.inner');
  const CARD=SCENES.map(s=>{
    let cls='card';
    if(s.quote){
      const tmp=document.createElement('div'); tmp.innerHTML=s.html;
      tmp.querySelectorAll('.src,.ttl,.sub').forEach(n=>n.remove());
      const n=tmp.textContent.trim().length;
      cls+=' quote '+(n<110?'q-s':n<260?'q-m':'q-l');
    } else if(s.bare) cls+=' bare';
    let ph='';
    if(s.photo && s.photo.src)
      ph='<div class="photo" style="background:'+(s.photo.tint||'#888')+'">'+
         '<img src="'+s.photo.src+'" alt=""></div>';
    return '<div class="'+cls+'">'+ph+s.html+legendFor(s)+'</div>';
  });
  SCENES.forEach((s,i)=>{
    const sec=document.createElement('section');
    sec.className='step'; sec.dataset.i=i;
    story.appendChild(sec);
  });
  let shownCard=-1;
  function showCard(i){
    if(i===shownCard) return; shownCard=i;
    host.classList.remove('on');
    setTimeout(()=>{ inner.innerHTML=CARD[i]||''; host.classList.add('on'); },140);
  }
  // colour the .stat helpers from the layer palette
  const st=document.createElement('style');
  st.textContent=`.stat.lamp{color:${LAYERS.stations.color}}.stat.float{color:${LAYERS.argo.color}}
    .stat.seal{color:${LAYERS.seals.color}}.stat.shark{color:${LAYERS.sharks.color}}
    .stat.tele{color:${LAYERS.telemetry.color}}.stat.cold{color:${LAYERS.coldspots.color}}
    .stat.warn{color:${LAYERS.mhews_2025.color}}.stat.turtle{color:${LAYERS.turtles.color}}`;
  document.head.appendChild(st);

  const proj=d3.geoOrthographic().translate([0,0]).clipAngle(90);
  const path=d3.geoPath(proj,ctx), grat=d3.geoGraticule10(), sph={type:'Sphere'};
  let W=0,H=0,R=1,dirty=true,sceneIdx=0;

  function zero(){ const o={}; for(const k in LAYERS) o[k]=0; return o; }
  function target(i){
    const s=SCENES[i]||SCENES[0];
    return { rot:[-s.center[0],-s.center[1]], z:s.zoom, sats:(s.sats||0),
             wipe:(s.wipe||null), a:Object.assign(zero(),s.layers) };
  }
  let cur=target(0), tgt=target(0);
  cur={rot:cur.rot.slice(),z:cur.z,a:Object.assign({},cur.a)};

  function resize(){
    const r=cv.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
    W=r.width;H=r.height; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); R=Math.min(W,H)*SETTINGS.globeSize; dirty=true;
  }
  addEventListener('resize',resize);

  function drawLayer(key,alpha){
    if(alpha<=.012||!L[key]) return;
    const cfg=live.layers[key];
    if(ISPT[key]==='shell')    return drawShell(key,cfg,alpha);
    if(ISPT[key]==='timeline') return drawTimeline(key,cfg,alpha);
    if(ISPT[key]==='tracks')  return drawTracks(key,cfg,alpha);
    if(ISPT[key]==='bubbles') return drawBubbles(key,cfg,alpha);
    if(ISPT[key]) return drawPoints(key,cfg,alpha);
    const rgb=hex2rgb(cfg.color), p=cfg.power;
    const arr=L[key], nm=Math.pow(MAXN[key],p);
    const c=proj.rotate(), ctr=[-c[0],-c[1]], s=proj.scale();
    const sz=Math.max(0.3,(s/210)*SETTINGS.dotScale*(cfg.size===undefined?1:cfg.size)), h=sz/2;
    const floor=(cfg.floor===undefined?0.13:cfg.floor), gain=(cfg.gain===undefined?7:cfg.gain);
    const base='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',';
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<arr.length;i+=3){
      const lo=arr[i],la=arr[i+1];
      if(d3.geoDistance([lo,la],ctr)>1.5533) continue;
      const xy=proj([lo,la]); if(!xy) continue;
      let v=Math.pow(arr[i+2],p)/nm; v=floor+(1-floor)*Math.min(1,v*gain);
      ctx.fillStyle=base+(v*alpha).toFixed(3)+')';
      ctx.fillRect(xy[0]-h,xy[1]-h,sz,sz);
    }
    ctx.globalCompositeOperation='source-over';
  }

  // plain dots: one small circle each, drawn normally. ~9,000 of them, cheap.
  function drawPoints(key,cfg,alpha){
    const arr=L[key], c=proj.rotate(), ctr=[-c[0],-c[1]];
    // grow gently with zoom (fourth root) so close-ups don't turn into blobs
    const g=Math.min(2.6,Math.max(0.6,Math.pow(proj.scale()/520,0.25)));
    const r=Math.max(0.5,(cfg.dot===undefined?1.3:cfg.dot)*g*SETTINGS.dotScale);
    ctx.fillStyle=cfg.color; ctx.globalAlpha=alpha*(cfg.alpha===undefined?0.95:cfg.alpha);
    ctx.beginPath();
    for(let i=0;i<arr.length;i+=2){
      const lo=arr[i],la=arr[i+1];
      if(d3.geoDistance([lo,la],ctr)>1.5533) continue;
      const xy=proj([lo,la]); if(!xy) continue;
      ctx.moveTo(xy[0]+r,xy[1]);
      ctx.arc(xy[0],xy[1],r,0,6.2832);
    }
    ctx.fill(); ctx.globalAlpha=1;
  }

  // storm tracks: one polyline per storm, coloured by peak category,
  // with a bright pulse travelling along each track.
  let pulse=0;
  function drawTracks(key,cfg,alpha){
    const D=L[key], xy=D.xy, lens=D.len, cats=D.cat, ramp=cfg.ramp||['#FFFFFF'];
    const c=proj.rotate(), ctr=[-c[0],-c[1]], s=proj.scale();
    const lw=Math.max(0.5,(cfg.width||1)*Math.min(2.2,Math.max(0.55,Math.pow(s/520,0.28))));
    let p=0;
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(let k=0;k<lens.length;k++){
      const n=lens[k], col=ramp[Math.min(ramp.length-1,cats[k])];
      // base line
      ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.globalAlpha=alpha*0.55;
      ctx.beginPath(); let started=false;
      for(let i=0;i<n;i++){
        const lo=xy[(p+i)*2], la=xy[(p+i)*2+1];
        if(d3.geoDistance([lo,la],ctr)>1.5533){ started=false; continue; }
        const q=proj([lo,la]); if(!q){ started=false; continue; }
        if(!started){ ctx.moveTo(q[0],q[1]); started=true; } else ctx.lineTo(q[0],q[1]);
      }
      ctx.stroke();
      // travelling pulse
      if(cfg.animate!==false && n>2){
        const head=((pulse+k*0.037)%1)*(n-1);
        const i0=Math.max(0,Math.floor(head)-2), i1=Math.min(n-1,Math.floor(head)+1);
        ctx.globalAlpha=alpha; ctx.lineWidth=lw*1.9;
        ctx.beginPath(); started=false;
        for(let i=i0;i<=i1;i++){
          const lo=xy[(p+i)*2], la=xy[(p+i)*2+1];
          if(d3.geoDistance([lo,la],ctr)>1.5533){ started=false; continue; }
          const q=proj([lo,la]); if(!q){ started=false; continue; }
          if(!started){ ctx.moveTo(q[0],q[1]); started=true; } else ctx.lineTo(q[0],q[1]);
        }
        ctx.stroke();
      }
      p+=n;
    }
    ctx.globalAlpha=1;
  }

  // proportional circles: area scales with the value
  function drawBubbles(key,cfg,alpha){
    const D=L[key], xy=D.xy, v=D.v;
    let mx=0; for(let i=0;i<v.length;i++) if(v[i]>mx) mx=v[i];
    const c=proj.rotate(), ctr=[-c[0],-c[1]];
    const k=(cfg.bubble||20)*Math.min(2,Math.max(0.6,Math.pow(proj.scale()/520,0.3)));
    ctx.fillStyle=cfg.color; ctx.globalAlpha=alpha;
    ctx.beginPath();
    for(let i=0;i<v.length;i++){
      const lo=xy[i*2], la=xy[i*2+1];
      if(d3.geoDistance([lo,la],ctr)>1.5533) continue;
      const q=proj([lo,la]); if(!q) continue;
      const r=Math.max(0.8,k*Math.sqrt(v[i]/mx));
      ctx.moveTo(q[0]+r,q[1]); ctx.arc(q[0],q[1],r,0,6.2832);
    }
    ctx.fill(); ctx.globalAlpha=1;
  }

  // a shell of dots floating above the sphere. Not real orbits: geostationary
  // orbit is 6.6 Earth radii out and would not fit on screen beside the planet.
  function drawShell(key,cfg,alpha){
    const D=L[key], xy=D.xy, alt=D.alt||1.08;
    const c=proj.rotate(), ctr=[-c[0],-c[1]], s=proj.scale(), t=proj.translate();
    const r=Math.max(0.6,(cfg.dot||1.4)*Math.min(2.2,Math.max(0.6,Math.pow(s/520,0.25))));
    ctx.fillStyle=cfg.color; ctx.globalAlpha=alpha;
    ctx.beginPath();
    for(let i=0;i<xy.length;i+=2){
      const lo=xy[i],la=xy[i+1];
      const behind=d3.geoDistance([lo,la],ctr)>1.5708;
      const q=proj([lo,la]);
      let x,y;
      if(q && !behind){ x=t[0]+(q[0]-t[0])*alt; y=t[1]+(q[1]-t[1])*alt; }
      else continue;                                  // hide anything round the back
      ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,6.2832);
    }
    ctx.fill(); ctx.globalAlpha=1;
  }

  // stations that switch off as a year cursor advances
  let sweepT=0;
  function drawTimeline(key,cfg,alpha){
    const D=L[key], xy=D.xy, yr=D.y;
    const year=D.from+(D.to-D.from)*sweepT;
    const c=proj.rotate(), ctr=[-c[0],-c[1]];
    const r=Math.max(0.5,(cfg.dot||1)*Math.min(2.4,Math.max(0.6,Math.pow(proj.scale()/520,0.25))));
    ctx.fillStyle=cfg.color; ctx.globalAlpha=alpha;
    ctx.beginPath();
    let live=0;
    for(let i=0;i<yr.length;i++){
      if(yr[i]<year) continue;                        // this one has already stopped
      const lo=xy[i*2],la=xy[i*2+1];
      if(d3.geoDistance([lo,la],ctr)>1.5533) continue;
      const q=proj([lo,la]); if(!q) continue; live++;
      ctx.moveTo(q[0]+r,q[1]); ctx.arc(q[0],q[1],r,0,6.2832);
    }
    ctx.fill(); ctx.globalAlpha=1;
    const el=document.getElementById('yearTag');
    if(el){ el.textContent=Math.round(year); el.style.opacity=alpha>0.1?1:0; }
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    proj.translate([W<760?W/2:W*SETTINGS.globeX,H*.5]).scale(R*cur.z).rotate(cur.rot);
    ctx.beginPath(); path(sph); ctx.fillStyle=live.look.ocean; ctx.fill();
    ctx.beginPath(); path(grat); ctx.strokeStyle=live.look.graticule; ctx.lineWidth=.5; ctx.stroke();
    ctx.beginPath(); path(DATA.land); ctx.fillStyle=live.look.land; ctx.fill();
    ctx.strokeStyle=live.look.coastline; ctx.lineWidth=.6; ctx.stroke();
    for(const k in LAYERS) drawLayer(k,cur.a[k]||0);
    drawSats(cur.sats||0);
    placeFrame(); drawWipe();
    ctx.beginPath(); path(sph); ctx.strokeStyle=live.look.coastline; ctx.lineWidth=1; ctx.stroke();
  }

  // geostationary footprints: a circle on the sphere around each sub-satellite point
  const circle=d3.geoCircle().center([0,0]).radius(SATELLITES.reach).precision(2);
  function drawSats(alpha){
    if(alpha<=.012) return;
    ctx.save();
    for(const s of SATELLITES.list){
      const c=circle.center([s.lon,0])();
      ctx.beginPath(); path(c);
      ctx.fillStyle=SATELLITES.color; ctx.globalAlpha=0.055*alpha; ctx.fill();
      ctx.globalAlpha=0.5*alpha; ctx.strokeStyle=SATELLITES.color; ctx.lineWidth=0.8; ctx.stroke();
      // the point on the ground directly beneath the satellite
      const p=proj([s.lon,0]);
      if(p){
        const rot=proj.rotate();
        if(d3.geoDistance([s.lon,0],[-rot[0],-rot[1]])<1.5533){
          ctx.globalAlpha=0.9*alpha; ctx.beginPath();
          ctx.arc(p[0],p[1],2.2,0,6.2832); ctx.fill();
        }
      }
    }
    ctx.restore(); ctx.globalAlpha=1;
  }

  // ---- on-globe wipe panel ----
  const cmp=document.getElementById('cmp');
  let wipeKey=null, wipeFrac=0.5, wipeBox=null;
  function showWipe(key){
    if(key===wipeKey) return; wipeKey=key; wipeBox=null;
    if(!key){ cmp.classList.remove('on'); dirty=true; return; }
    const c=WIPE[key];
    if(!c){ console.warn('no WIPE entry named "'+key+'"'); cmp.classList.remove('on'); return; }
    wipeFrac=0.5;
    cmp.classList.toggle('broken',!!c.broken);
    const fr=cmp.querySelector('.imgs');
    if(c.img){
      fr.innerHTML='<img class="r" src="'+c.img.right+'" alt="">'+
                   '<div class="clip"><img class="l" src="'+c.img.left+'" alt=""></div>';
      cmp.classList.add('hasimg');
    } else { fr.innerHTML=''; cmp.classList.remove('hasimg'); }
    cmp.querySelector('.note').innerHTML=c.note||'';
    cmp.querySelector('.lab.l').textContent=c.left||'';
    cmp.querySelector('.lab.r').textContent=c.right||'';
    cmp.querySelector('.msg').textContent=c.broken?'no second map to compare against':'';
    cmp.querySelector('input').value=50; syncWipeUI(50);
    cmp.classList.add('on'); dirty=true;
  }
  // position the DOM frame over the projected box each render
  function placeFrame(){
    if(!wipeKey||!WIPE[wipeKey]) return;
    const b=WIPE[wipeKey].box, pts=[];
    for(let i=0;i<=20;i++){
      pts.push([b[0]+(b[2]-b[0])*i/20,b[1]],[b[0]+(b[2]-b[0])*i/20,b[3]],
               [b[0],b[1]+(b[3]-b[1])*i/20],[b[2],b[1]+(b[3]-b[1])*i/20]);
    }
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,any=false;
    const c=proj.rotate(), ctr=[-c[0],-c[1]];
    for(const p of pts){
      if(d3.geoDistance(p,ctr)>1.5533) continue;
      const q=proj(p); if(!q) continue; any=true;
      x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]); y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]);
    }
    if(!any){ cmp.style.display='none'; wipeBox=null; return; }
    cmp.style.display='block';
    const pad = (WIPE[wipeKey] && WIPE[wipeKey].img) ? 0 : 14;
    wipeBox={x:x0-pad,y:y0-pad,w:(x1-x0)+pad*2,h:(y1-y0)+pad*2};
    const r=cv.getBoundingClientRect();
    cmp.style.left=(r.left+wipeBox.x)+'px'; cmp.style.top=(r.top+wipeBox.y)+'px';
    cmp.style.width=wipeBox.w+'px'; cmp.style.height=wipeBox.h+'px';
    cmp.classList.toggle('narrow', wipeBox.w < 200);
    const li=cmp.querySelector('.imgs .clip img'); if(li) li.style.width=wipeBox.w+'px';
  }
  function drawWipe(){
    if(!wipeKey||!WIPE[wipeKey]||!wipeBox) return;
    const c=WIPE[wipeKey];
    if(c.under) { ctx.save(); clipBox(); drawLayer(c.under,1); ctx.restore(); }
    if(c.over && !c.broken){
      ctx.save(); clipBox(wipeBox.x+wipeBox.w*wipeFrac); drawLayer(c.over,1); ctx.restore();
    }
  }
  function clipBox(rightEdge){
    const w=(rightEdge===undefined? wipeBox.w : rightEdge-wipeBox.x);
    ctx.beginPath(); ctx.rect(wipeBox.x,wipeBox.y,w,wipeBox.h); ctx.clip();
  }

  function sh(a,b){ let d=(b-a)%360; if(d>180)d-=360; if(d<-180)d+=360; return a+d; }
  function tick(){
    if(dirty){
      const e=reduce?1:SETTINGS.easing; let mv=0;
      const dl=sh(cur.rot[0],tgt.rot[0])-cur.rot[0]; cur.rot[0]+=dl*e; mv+=Math.abs(dl);
      const dp=tgt.rot[1]-cur.rot[1]; cur.rot[1]+=dp*e; mv+=Math.abs(dp);
      const dz=tgt.z-cur.z; cur.z+=dz*e; mv+=Math.abs(dz)*90;
      const ds=(tgt.sats||0)-(cur.sats||0); cur.sats=(cur.sats||0)+ds*e; mv+=Math.abs(ds)*90;
      for(const k in tgt.a){ const d=tgt.a[k]-(cur.a[k]||0); cur.a[k]=(cur.a[k]||0)+d*e; mv+=Math.abs(d)*90; }
      render();
      if(mv<.25){ cur.rot=tgt.rot.slice(); cur.z=tgt.z; cur.sats=tgt.sats||0; cur.a=Object.assign({},tgt.a); render(); dirty=false; }
    }
    // storm pulses need a continuous loop of their own
    let anim=false, sweeping=false;
    for(const k in LAYERS){
      if(ISPT[k]==='tracks' && (cur.a[k]||0)>0.02 && LAYERS[k].animate!==false) anim=true;
      if(ISPT[k]==='timeline' && (cur.a[k]||0)>0.02) sweeping=true;
    }
    if(sweeping && !reduce){ sweepT=Math.min(1,sweepT+0.0018); anim=true; }
    if(!sweeping) sweepT=0;
    if(anim && !reduce){ pulse=(pulse+0.0032)%1; render();
      if(panelOpen) syncPanel();
    }
    requestAnimationFrame(tick);
  }

  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting && document.body.dataset.mode!=='explore'){
      sceneIdx=+en.target.dataset.i; tgt=target(sceneIdx);
      showWipe(tgt.wipe); showCard(sceneIdx); dirty=true; }
  }),{rootMargin:'-42% 0px -42% 0px'});
  document.querySelectorAll('.step').forEach(s=>io.observe(s));

  // ---------------- control panel ----------------
  const panel=document.getElementById('panel'); let panelOpen=false;
  function buildPanel(){
    let h='<h4>Controls</h4><p class="hint">Drag to tune. Press D to hide.</p>';
    h+='<div class="grp"><h4>Camera</h4>';
    h+='<label>Longitude <span class="val" id="vLon"></span></label><input type="range" id="sLon" min="-180" max="180" step="1">';
    h+='<label>Latitude <span class="val" id="vLat"></span></label><input type="range" id="sLat" min="-90" max="90" step="1">';
    h+='<label>Zoom <span class="val" id="vZ"></span></label><input type="range" id="sZ" min="0.5" max="2.6" step="0.01">';
    h+='</div><div class="grp"><h4>Layers</h4>';
    for(const k in LAYERS){
      h+=`<div class="row"><input type="checkbox" id="c_${k}"><span>${LAYERS[k].label}</span>
          <input type="color" id="k_${k}" value="${LAYERS[k].color}"><span class="val" id="v_${k}"></span></div>
          <input type="range" id="a_${k}" min="0" max="1" step="0.01">`;
    }
    h+=`<div class="row"><input type="checkbox" id="c_sats"><span>Geostationary footprints</span></div>
        <input type="range" id="a_sats" min="0" max="1" step="0.01">`;
    h+='</div><div class="grp"><h4>Dot look</h4>';
    h+='<label>Layer</label><select id="tuneLayer" style="width:100%;background:#1B2531;color:#ECEAE5;border:1px solid #2C3846;padding:.3rem">';
    for(const k in LAYERS) h+=`<option value="${k}">${LAYERS[k].label}</option>`;
    h+='</select>';
    h+='<label>Size <span class="val" id="vSize"></span></label><input type="range" id="tSize" min="0.2" max="3" step="0.05">';
    h+='<label>Floor <span class="val" id="vFloor"></span></label><input type="range" id="tFloor" min="0" max="0.5" step="0.01">';
    h+='<label>Gain <span class="val" id="vGain"></span></label><input type="range" id="tGain" min="0.5" max="12" step="0.1">';
    h+='</div><div class="grp"><button id="copyBtn">Copy this scene config</button><pre id="out"></pre></div>';
    panel.innerHTML=h;

    ['Lon','Lat','Z'].forEach(id=>document.getElementById('s'+id).addEventListener('input',fromPanel));
    for(const k in LAYERS){
      document.getElementById('c_'+k).addEventListener('input',fromPanel);
      document.getElementById('a_'+k).addEventListener('input',fromPanel);
      document.getElementById('k_'+k).addEventListener('input',e=>{ live.layers[k].color=e.target.value; render(); });
    }
    document.getElementById('c_sats').addEventListener('input',fromPanel);
    document.getElementById('a_sats').addEventListener('input',fromPanel);
    const sel=document.getElementById('tuneLayer');
    function loadTune(){ const c=live.layers[sel.value];
      const pt=!!ISPT[sel.value];
      document.getElementById('tFloor').disabled=pt;
      document.getElementById('tGain').disabled=pt;
      document.getElementById('tSize').value=c.size===undefined?1:c.size;
      document.getElementById('tFloor').value=c.floor===undefined?0.13:c.floor;
      document.getElementById('tGain').value=c.gain===undefined?7:c.gain;
      showTune(); }
    function showTune(){
      document.getElementById('vSize').textContent=(+document.getElementById('tSize').value).toFixed(2);
      document.getElementById('vFloor').textContent=(+document.getElementById('tFloor').value).toFixed(2);
      document.getElementById('vGain').textContent=(+document.getElementById('tGain').value).toFixed(1);
    }
    function applyTune(){ const c=live.layers[sel.value];
      if(ISPT[sel.value]){ c.dot=+document.getElementById('tSize').value; showTune(); render();
        document.getElementById('out').textContent=`${sel.value}: { ... dot:${c.dot} }`; return; }
      c.size=+document.getElementById('tSize').value;
      c.floor=+document.getElementById('tFloor').value;
      c.gain=+document.getElementById('tGain').value;
      showTune(); render();
      document.getElementById('out').textContent=
        `${sel.value}: { ... size:${c.size}, floor:${c.floor}, gain:${c.gain} }`;
    }
    sel.addEventListener('change',loadTune);
    ['tSize','tFloor','tGain'].forEach(id=>document.getElementById(id).addEventListener('input',applyTune));
    loadTune();
    document.getElementById('copyBtn').addEventListener('click',copyScene);
  }
  function syncPanel(){
    document.getElementById('sLon').value=Math.round(-cur.rot[0]);
    document.getElementById('sLat').value=Math.round(-cur.rot[1]);
    document.getElementById('sZ').value=cur.z.toFixed(2);
    document.getElementById('vLon').textContent=Math.round(-cur.rot[0]);
    document.getElementById('vLat').textContent=Math.round(-cur.rot[1]);
    document.getElementById('vZ').textContent=cur.z.toFixed(2);
    for(const k in LAYERS){
      const a=cur.a[k]||0;
      document.getElementById('a_'+k).value=a.toFixed(2);
      document.getElementById('c_'+k).checked=a>0.01;
      document.getElementById('v_'+k).textContent=a.toFixed(2);
    }
    document.getElementById('a_sats').value=(cur.sats||0).toFixed(2);
    document.getElementById('c_sats').checked=(cur.sats||0)>0.01;
  }
  function fromPanel(){
    tgt.rot=[-(+document.getElementById('sLon').value), -(+document.getElementById('sLat').value)];
    tgt.z=+document.getElementById('sZ').value;
    for(const k in LAYERS){
      const on=document.getElementById('c_'+k).checked;
      let a=+document.getElementById('a_'+k).value;
      if(!on) a=0; else if(a<0.02) a=1;
      tgt.a[k]=a;
    }
    { const on=document.getElementById('c_sats').checked;
      let a=+document.getElementById('a_sats').value;
      tgt.sats = on ? (a<0.02?1:a) : 0; }
    cur.rot=tgt.rot.slice(); cur.z=tgt.z; cur.sats=tgt.sats; cur.a=Object.assign({},tgt.a);
    render(); syncPanel();
  }
  function copyScene(){
    const lon=Math.round(-cur.rot[0]), lat=Math.round(-cur.rot[1]);
    const on={}; for(const k in LAYERS) if((cur.a[k]||0)>0.01) on[k]=+(cur.a[k].toFixed(2));
    const s=(cur.sats||0)>0.01 ? ` sats:${cur.sats.toFixed(2)},` : '';
    const txt=`{ center:[${lon}, ${lat}], zoom:${cur.z.toFixed(2)},${s} layers:${JSON.stringify(on)},\n    html:\`\` },`;
    document.getElementById('out').textContent=txt;
    navigator.clipboard && navigator.clipboard.writeText(txt);
  }
  addEventListener('keydown',e=>{
    if(!SETTINGS.showPanel) return;
    if(e.key==='d'||e.key==='D'){
      panelOpen=!panelOpen; panel.classList.toggle('open',panelOpen);
      document.getElementById('hintbar').style.display=panelOpen?'none':'block';
      if(panelOpen) syncPanel();
    }
  });
  if(SETTINGS.showPanel) buildPanel(); else document.getElementById('hintbar').style.display='none';

  function syncWipeUI(v){
    cmp.querySelector('.bar').style.left=v+'%';
    cmp.querySelector('.knob').style.left=v+'%';
    const clip=cmp.querySelector('.imgs .clip');
    if(clip){ clip.style.width=v+'%';
      const img=clip.querySelector('img');
      if(img && wipeBox) img.style.width=wipeBox.w+'px';
    }
  }
  cmp.querySelector('input').addEventListener('input',e=>{
    wipeFrac=e.target.value/100; syncWipeUI(e.target.value);
    dirty=true; render();
  });

  // ================= EXPLORE MODE =================
  // Same globe, same layers. The story drives the camera in one mode;
  // you drive it in the other.
  const exp={on:false, a:{}};
  for(const k in LAYERS) exp.a[k]=0;
  ['stations','argo'].forEach(k=>{ if(LAYERS[k]) exp.a[k]=1; });

  const bar=document.getElementById('topbar');
  const nStory=document.getElementById('navStory'), nExp=document.getElementById('navExplore');
  const panel2=document.getElementById('explore');

  function buildExploreLayers(){
    let s='';
    for(const k in LAYERS){
      const c=LAYERS[k];
      const col=c.color || (c.ramp && c.ramp[c.ramp.length-1]) || '#ECEAE5';
      s+=`<div class="lrow"><input type="checkbox" id="x_${k}"><i style="background:${col}"></i>`+
         `<span>${c.label}</span><output id="xo_${k}"></output></div>`+
         `<input type="range" id="xr_${k}" min="0" max="1" step="0.05">`;
    }
    document.getElementById('expLayers').innerHTML=s;
    for(const k in LAYERS){
      const cb=document.getElementById('x_'+k), rg=document.getElementById('xr_'+k);
      cb.checked = exp.a[k]>0.02; rg.value = exp.a[k]||1;
      const upd=()=>{ exp.a[k]= cb.checked ? (+rg.value||1) : 0;
        document.getElementById('xo_'+k).textContent = exp.a[k] ? exp.a[k].toFixed(2) : 'off';
        if(exp.on){ tgt.a=Object.assign({},exp.a); cur.a=Object.assign({},exp.a); dirty=true; render(); } };
      cb.addEventListener('input',upd); rg.addEventListener('input',()=>{ cb.checked=+rg.value>0.02; upd(); });
      upd();
    }
  }

  function syncExploreView(){
    const lon=Math.round(-cur.rot[0]), lat=Math.round(-cur.rot[1]);
    document.getElementById('expLon').textContent=lon+'\u00b0';
    document.getElementById('expLat').textContent=lat+'\u00b0';
    document.getElementById('expZ').textContent=cur.z.toFixed(1)+'\u00d7';
    document.getElementById('expLonR').value=lon;
    document.getElementById('expLatR').value=lat;
    document.getElementById('expZR').value=Math.min(60,cur.z);
  }
  function setView(lon,lat,z){
    cur.rot=[-lon,-Math.max(-90,Math.min(90,lat))]; tgt.rot=cur.rot.slice();
    if(z!==undefined){ cur.z=z; tgt.z=z; }
    dirty=true; render(); syncExploreView();
  }
  ['expLonR','expLatR','expZR'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{
    setView(+document.getElementById('expLonR').value,
            +document.getElementById('expLatR').value,
            +document.getElementById('expZR').value);
  }));
  document.getElementById('expJump').addEventListener('change',e=>{
    if(!e.target.value) return;
    const [lo,la,z]=e.target.value.split(',').map(Number); setView(lo,la,z);
  });
  document.getElementById('expReset').addEventListener('click',()=>setView(-40,12,0.86));

  // drag to spin
  let drag=null;
  cv.addEventListener('pointerdown',e=>{ if(!exp.on) return;
    drag={x:e.clientX,y:e.clientY,rot:cur.rot.slice()}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove',e=>{ if(!exp.on||!drag) return;
    const k=76/proj.scale();
    setView(-(drag.rot[0]+(e.clientX-drag.x)*k), -(drag.rot[1]-(e.clientY-drag.y)*k));
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{ drag=null; }));
  cv.addEventListener('wheel',e=>{ if(!exp.on) return; e.preventDefault();
    const z=Math.max(0.6,Math.min(60,cur.z*(e.deltaY>0?0.92:1.087)));
    setView(-cur.rot[0],-cur.rot[1],z);
  },{passive:false});

  function setMode(m){
    exp.on = (m==='explore');
    document.body.dataset.mode=m;
    nStory.classList.toggle('on',!exp.on); nExp.classList.toggle('on',exp.on);
    if(exp.on){
      showWipe(null);
      tgt.a=Object.assign({},exp.a); cur.a=Object.assign({},exp.a);
      tgt.sats=0; cur.sats=0;
      syncExploreView();
    } else {
      tgt=target(sceneIdx); showCard(sceneIdx);
    }
    dirty=true; render();
  }
  nStory.addEventListener('click',()=>setMode('story'));
  nExp.addEventListener('click',()=>setMode('explore'));
  buildExploreLayers();
  setMode(location.hash==='#explore'?'explore':'story');

  const prog=document.getElementById('progress');
  function updateProgress(){
    const max=document.documentElement.scrollHeight-innerHeight;
    prog.style.width=(max>0 ? (scrollY/max)*100 : 0)+'%';
  }
  addEventListener('scroll',updateProgress,{passive:true});
  addEventListener('resize',updateProgress); updateProgress();

  resize(); requestAnimationFrame(tick);
 } catch(err){
   document.body.style.background = '#05080E';
   document.body.innerHTML =
     '<pre style="color:#F07A55;font:13px/1.6 ui-monospace,monospace;padding:2rem;white-space:pre-wrap">'
     + 'Something in the config is wrong:\n\n' + err.message + '\n\n' + (err.stack || '')
     + '</pre>';
   console.error(err);
 }
}
if(document.readyState==='loading') addEventListener('DOMContentLoaded',START); else START();
</script>
