<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories of Resilience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* same palette and type as the main site (site-src/template.html, LOOK) */
  :root{
    --bg:#05080E; --text:#ECEAE5; --muted:#8B95A1; --faint:#5C6773; --line:#222C38;
    --card:rgba(5,8,14,.84);
    --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --disp:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--text); font:15px/1.55 var(--sans); overflow:hidden}

  .stage{height:100%; display:grid; grid-template-columns:minmax(0,40fr) minmax(0,60fr)}
  /* the globe lives behind the whole page (as on the main site), so a zoomed globe isn't cut at the column edge;
     the left column fades from the background so the text stays readable */

  /* ---------- left: title, subtitle, story card ---------- */
  .panel{position:relative; z-index:1; padding:9vh 2vw 5vh 4vw; overflow-y:auto; scrollbar-width:none;
    background:linear-gradient(90deg, rgba(5,8,14,.96) 0%, rgba(5,8,14,.9) 70%, rgba(5,8,14,0) 100%)}
  .panel::-webkit-scrollbar{display:none}
  h1{font:400 clamp(1.8rem,2.7vw,2.6rem)/1.13 var(--disp); letter-spacing:-.02em; margin:0; max-width:18ch}
  .sub{color:var(--muted); font-size:1rem; line-height:1.5; margin:1.1rem 0 0; max-width:42ch}
  .hint{font:600 10.5px var(--sans); letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    margin-top:3.5vh; display:flex; align-items:center; gap:.6rem}
  .hint[hidden]{display:none}
  .hint i{width:9px; height:9px; border-radius:50%; border:1.2px solid var(--text); background:rgba(236,234,229,.16)}

  .card{margin-top:3.5vh; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:3px;
    padding:14px 14px 16px; position:relative; animation:in .35s ease}
  @keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .card[hidden]{display:none}
  .photo{position:relative; aspect-ratio:16/9; border-radius:2px}
  .meta{font:600 10px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px}
  .card h2{font:500 1.2rem/1.25 var(--disp); letter-spacing:-.01em; margin:0}
  /* inline link: the design system's .wm-link (underlined, the text's own colour) */
  .card p a.link{color:inherit; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px; text-decoration-color:var(--muted)}
  .card p a.link:hover, .card p a.link:focus-visible{text-decoration-color:currentColor}
  .card p{color:#D9D6CF; font-size:.9rem; line-height:1.55; margin:.6rem 0 0}
  .legend{display:flex; flex-direction:column; gap:.35rem; margin-top:12px; font-size:.78rem; color:var(--muted); line-height:1.35}
  .legend[hidden]{display:none}
  .legend span{display:flex; align-items:baseline; gap:.55rem}
  .legend i{width:7px; height:7px; border-radius:50%; flex:none; transform:translateY(-1px)}
  .foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px}
  .src{color:var(--faint); font-size:.75rem}
  /* link to the source: bottom-right corner of the photo */
  .more{position:absolute; right:10px; bottom:10px; width:34px; height:34px; border-radius:50%;
    border:1px solid rgba(236,234,229,.6); background:rgba(5,8,14,.55); display:grid; place-items:center;
    color:var(--text); text-decoration:none}
  .more:hover{border-color:var(--text); background:rgba(5,8,14,.8)}
  /* next story: bottom-right corner of the card */
  /* the design system's .wm-btn: an outlined rectangle with 2px corners */
  .next{flex:none; display:inline-flex; align-items:center; gap:.5rem; background:none; color:var(--text); cursor:pointer;
    border:1px solid rgba(236,234,229,.55); border-radius:2px; padding:.42rem .9rem; font:500 .8rem var(--sans);
    transition:background .15s, border-color .15s}
  .next:hover{border-color:var(--text); background:rgba(236,234,229,.08)}
  .next svg{width:12px; height:12px}
  .src{margin-right:1rem}
  .more svg{width:13px; height:13px}
  .close{position:absolute; top:20px; right:20px; width:26px; height:26px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(5,8,14,.6); color:var(--text); font:400 16px/26px var(--sans); padding:0}

  /* ---------- right: globe ---------- */
  .globewrap{position:fixed; inset:0; z-index:0}
  .globewrap canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #globe{cursor:grab} #globe.hot{cursor:pointer} #globe:active{cursor:grabbing}
  #relief{pointer-events:none}
  .tip{position:absolute; pointer-events:none; max-width:260px; font:500 12.5px/1.35 var(--sans); color:var(--text);
    background:var(--card); border:1px solid var(--line); border-radius:3px; padding:6px 9px; opacity:0;
    transform:translate(14px,-50%); transition:opacity .15s}
  .tip.on{opacity:1}
  .tip small{display:block; color:var(--muted); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; margin-top:2px}

  @media (max-width:760px){
    body{overflow:auto}
    .stage{grid-template-columns:1fr; grid-template-rows:auto 70vh; height:auto}
    .panel{padding:32px 16px 8px; overflow:visible}
    .panel{background:none}
    .globewrap{position:relative; inset:auto; grid-row:2}
  }
</style>
</head>
<body>
<main class="stage">
  <section class="panel">
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
    <div class="hint" id="hint"><i></i><span id="hintText"></span></div>
    <article class="card" id="card" hidden>
      <button class="close" id="close" aria-label="Close story">×</button>
      <div class="photo" id="photo" role="img" aria-label="Photo placeholder">
        <a class="more" id="more" target="_blank" rel="noopener" aria-label="Read the full story">
          <svg viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 10L10 3M4.5 3H10v5.5"/></svg>
        </a>
      </div>
      <div class="meta" id="meta"></div>
      <h2 id="ctitle"></h2>
      <p id="cdesc"></p>
      <div class="legend" id="legend" hidden></div>
      <div class="foot">
        <span class="src" id="csrc"></span>
        <button class="next" id="next" aria-label="Next story">Next
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 6h9M7 2.5L10.5 6 7 9.5"/></svg>
        </button>
      </div>
    </article>
  </section>
  <section class="globewrap" id="wrap">
    <canvas id="relief"></canvas>
    <canvas id="globe" aria-label="Globe with story locations; click a circle to read the story"></canvas>
    <div class="tip" id="tip"></div>
  </section>
</main>

<script id="DATA">const DATA = {"title":"Those least responsible for climate change are coping, and showing resilience","subtitle":"Stories about how citizen scientists, researchers, and people on the frontline, are …","stories":[{"id":"malawi-karonga","list":"flood","title":"Improved flood detectors save lives and property","description":"River sensors and an automated alert system on the North Rukuru River now warn families in Karonga District up to 72 hours before a flood, up from less than six hours. The district has had 21 major floods in five decades.","place":"Karonga District, Malawi","lon":33.93,"lat":-9.93,"source":"UNICEF Malawi","date":"2024-07-16","url":"https://www.unicef.org/malawi/stories/improved-flood-detectors-save-lives-and-property","color":"#2E4A5C","photo_ref":"https://www.unicef.org/malawi/sites/unicef.org.malawi/files/styles/hero_desktop/public/UNI613281.webp","photo_credit":"UNICEF Malawi/2024/Elephant Media"},{"id":"bangladesh-cpp","list":"flood","title":"Cyclone Amphan: In Bangladesh, Preparedness Paid Off","description":"As Cyclone Amphan approached in May 2020, more than 70,000 Cyclone Preparedness Programme volunteers spread warnings by megaphone, flag and door to door, and over two million people reached shelters. In 1970, the Bhola cyclone killed at least 300,000.","place":"Coastal Bangladesh","lon":90.3,"lat":22.3,"source":"American Red Cross","date":"2020-05-29","url":"https://www.redcross.org/about-us/news-and-events/news/2020/cyclone-amphan-in-bangladesh-preparedness-paid-off.html","color":"#2E4A3F","photo_ref":"","photo_credit":"Bangladesh Red Crescent; Brad Zerivitz / American Red Cross (photos on the page)"},{"id":"nepal-india-ratu","list":"flood","title":"Community cooperation across Nepal-India border saves lives during flood","description":"Volunteers on both sides of the border watch a low-cost sensor on the Ratu River and phone warnings downstream when the water rises. The system cost about US$3,500 and gives around 64,000 people one to three hours' warning each year.","place":"Ratu River, Nepal–India border","lon":85.85,"lat":26.75,"source":"ICIMOD","date":"2023-02-27","url":"https://www.icimod.org/article/community-cooperation-across-nepal-india-border-saves-lives-during-flood/","color":"#3B4A2E","photo_ref":"","photo_credit":"Krishna Murari Kishan / Alamy (main image on the page)"},{"id":"cambodia","list":"flood","title":"Protecting lives in flood-prone Cambodia","description":"People in Need built an early warning system that sends flood alerts straight to mobile phones, triggered automatically by a river sensor called Tepmachcha. It covers more than 200,000 households, after floods in 2013 affected 1.7 million people.","place":"Cambodia","lon":104.9,"lat":12.6,"source":"UNICEF Office of Innovation","date":"2017-07-06","url":"https://www.unicef.org/innovation/stories/protecting-lives-flood-prone-cambodia","color":"#4A3B2E","photo_ref":"https://www.unicef.org/innovation/sites/unicef.org.innovation/files/styles/hero_desktop/public/UN0222133.jpg.webp","photo_credit":"UNICEF/UN0222133/Brown"},{"id":"nepal-saptari","list":"flood","title":"Putting resilience at the centre of development","description":"In Saptari, river early warning systems and community emergency centres, backed by UNICEF, let families prepare and move before floods arrive, as part of a programme that puts children at the centre of disaster planning.","place":"Saptari District, Nepal","lon":86.7,"lat":26.6,"source":"UNICEF Nepal","date":"2020-02-25","url":"https://www.unicef.org/nepal/stories/putting-resilience-centre-development","color":"#2E3F4A","photo_ref":"","photo_credit":"UNICEF Nepal/2019/PShrestha"},{"id":"kenya-tana","list":"flood","title":"Bridging the monitoring gap: UNESCO and WRA launch IoT to enhance flood early warnings","description":"In March 2026, UNESCO and Kenya's Water Resources Authority installed internet-connected sensors in the Tana River Basin that report river levels, rainfall and soil moisture in real time, giving downstream communities earlier notice of floods.","place":"Tana River Basin, Kenya","lon":39.0,"lat":-0.8,"source":"UNESCO","date":"2026-04-14","url":"https://www.unesco.org/en/articles/bridging-monitoring-gap-unesco-and-wra-launch-iot-enhance-flood-early-warnings","color":"#2E4A44","photo_ref":"https://www.unesco.org/sites/default/files/styles/paragraph_medium_desktop/article/2026-04/DSC_1044.JPG","photo_credit":"UNESCO"},{"id":"ghana-aboabo","list":"flood","title":"TAHMO: Leveraging commercial microwave link data to develop flood early warning systems","description":"In Aboabo, TAHMO measures rainfall from the way it weakens the signal between mobile-phone masts, adds low-cost river sensors and residents' smartphone videos of the river, and sends flood alerts by SMS, voice call and WhatsApp.","place":"Aboabo, Ghana","lon":-1.61,"lat":6.69,"source":"GSMA","date":"2025-12-03","url":"https://www.gsma.com/solutions-and-impact/connectivity-for-good/mobile-for-development/gsma_resources/tahmo-leveraging-commercial-microwave-link-data-to-develop-flood-early-warning-systems/","color":"#4A2E3B","photo_ref":"","photo_credit":""},{"id":"india-assam","list":"flood","title":"Community-Based Flood Early Warning System — India","description":"In Assam's Lakhimpur and Dhemaji districts, a riverbank sensor radios a signal when the water reaches a critical level, and the warning is passed by mobile phone to 45 vulnerable communities downstream. It won a UNFCCC Momentum for Change award in 2014.","place":"Lakhimpur and Dhemaji, Assam, India","lon":94.5,"lat":27.4,"source":"UNFCCC; ICIMOD","date":"2014-12-10","url":"https://unfccc.int/climate-action/un-global-climate-action-awards/winning-projects/activity-database/community-based-flood-early-warning-system-india","color":"#3F3A4A","photo_ref":"","photo_credit":""},{"id":"seals","list":"animals","title":"Elephant seals measure the ocean where floats can't go","description":"Argo floats can't surface through sea ice to report, but elephant seals carrying sensor tags dive beneath it. In the data used here, about three-quarters of ocean temperature profiles south of 65°S come from seals: a network nobody planned.","place":"Southern Ocean","lon":70.0,"lat":-60.0,"zoom":1.0,"layers":[{"key":"seals","alpha":1},{"key":"argo","alpha":0.45}],"source":"MEOP-CTD database; Argo","date":"2026-09-23","url":"https://www.meop.net/database/meop-databases/meop-ctd-database.html","color":"#2E4A44","photo_ref":"","photo_credit":"","link":{"text":"elephant seals","url":"https://www.meop.net/database/meop-databases/meop-ctd-database.html","note":"the seal data: MEOP-CTD database (marine mammals exploring the oceans pole to pole)"}},{"id":"sharks","list":"animals","title":"Sharks carrying sensors sharpen ocean forecasts","description":"29 blue and shortfin mako sharks tagged with depth and temperature sensors logged more than 8,200 ocean profiles in the Northwest Atlantic. Fed into a forecast model, they cut surface temperature error by up to 40%, most over the continental shelf and slope.","place":"Northwest Atlantic, Gulf Stream","lon":-73.0,"lat":36.0,"zoom":2.2,"layers":[{"key":"sharks","alpha":1},{"key":"argo","alpha":0.35}],"source":"McDonnell et al., npj Climate and Atmospheric Science 9:147","date":"2026","url":"https://doi.org/10.1038/s41612-026-01394-9","color":"#4A3A33","photo_ref":"","photo_credit":""},{"id":"march-2020","list":"animals","title":"Tagged animals could carry sensors into the gaps Argo misses","description":"Mapping over 1.5 million Argo profiles, a study found gaps covering 18.6% of the ocean: polar seas, shallow shelves, marginal seas and upwelling zones. Set against 183 marine species and more than 3,000 tracked animals, it argues seals, turtles and sharks could fill them.","place":"Global study; the Caribbean is one of the gaps it names","lon":-75.0,"lat":15.0,"zoom":1.0,"layers":[{"key":"coldspots","alpha":1},{"key":"telemetry","alpha":0.7}],"source":"March et al., Global Change Biology 26:586","date":"2020","url":"https://doi.org/10.1111/gcb.14902","color":"#33304A","photo_ref":"","photo_credit":""},{"id":"south-australia","list":"hope","title":"South Australia increases its net electricity generation from renewables from 1% in 2007 to over 75% in 2025","description":"Wind and solar are now the state's main sources of electricity: wind supplied around 45% and solar over 32% in 2024/25, with about half of homes carrying rooftop panels. The state aims for 100% net renewable electricity by 2027.","place":"South Australia","lon":135.8,"lat":-30.5,"source":"Government of South Australia","date":"2026","url":"https://www.energymining.sa.gov.au/industry/hydrogen-and-renewable-energy/leading-the-green-economy","color":"#4A452E","photo_ref":"","photo_credit":""},{"id":"eu-wind-solar","list":"hope","title":"Wind and solar overtake fossil power in the EU for the first time in 2025","description":"In 2025, wind and solar generated 30% of the EU's electricity, ahead of fossil fuels at 29%, for the first time. Solar alone reached a record 13%, and coal fell to a historic low of 9.2%.","place":"European Union","lon":9.9,"lat":49.8,"source":"Ember","date":"2026-01-22","url":"https://ember-energy.org/latest-updates/wind-and-solar-generated-more-power-than-fossil-fuels-in-the-eu-for-the-first-time-in-2025/","color":"#2E3B4A","photo_ref":"","photo_credit":""},{"id":"right-whales","list":"hope","title":"Endangered North Atlantic right whales had their most calves in nearly two decades","description":"Aerial surveys off the southeastern United States counted 23 right whale calves in the 2026 calving season, the most since 2009, and sighted 129 individual whales across more than 1,400 flight hours.","place":"Calving grounds, southeastern United States","lon":-80.9,"lat":30.6,"source":"NOAA Fisheries","date":"2026-04-30","url":"https://www.fisheries.noaa.gov/feature-story/numbers-2026-north-atlantic-right-whale-calving-season","color":"#2E444A","photo_ref":"https://www.fisheries.noaa.gov/s3/2026-04/fwc_0892_14mar2026_4617_mom.JPG","photo_credit":"Florida Fish and Wildlife Conservation Commission, NOAA permit #26919"},{"id":"mangroves","list":"hope","title":"Global mangrove forests rebound, offering signs for climate and coastal resilience","description":"A four-decade satellite study led by Tulane University found that mangrove gains have outpaced losses for the past 16 years, leaving a net decline of only about 1% since the 1980s.","place":"Global study, Tulane University, New Orleans","lon":-89.4,"lat":29.2,"source":"Tulane University","date":"2026-06-04","url":"https://news.tulane.edu/pr/global-mangrove-forests-rebound-offering-hopeful-sign-climate-and-coastal-resilience","color":"#2F4A3A","photo_ref":"https://tulane.edu/sites/default/files/styles/manual_crop/public/2026-06/Mangroves%202.jpg","photo_credit":"Daniel Friess"},{"id":"dorset-puffins","list":"hope","title":"First puffling sighting in three decades gives hope for Dorset's dwindling puffin colony","description":"Volunteers monitoring Dancing Ledge on the Purbeck coast saw a young puffin leave its cliff crevice, the first in about 30 years, at a colony now down to around three breeding pairs.","place":"Dancing Ledge, Dorset, UK","lon":-2.01,"lat":50.59,"source":"National Trust","date":"2026-07-22","url":"https://www.nationaltrust.org.uk/services/media/2026/july/first-puffling-sighting-in-three-decades-gives-hope-for-dorsets-dwindling-puffin-colony","color":"#3A3F4A","photo_ref":"https://nt.global.ssl.fastly.net/binaries/content/gallery/website/national/library/our-cause/general-conservation/dancing-ledge-dorset.jpg","photo_credit":"© Will Wilkinson"},{"id":"yangtze","list":"hope","title":"China's Yangtze River shows dramatic recovery after four-year fishing ban","description":"After China banned commercial fishing across the Yangtze basin in 2021, a study in Science found the mass of fish in survey samples more than doubled between 2018 and 2023, and finless porpoises rose from 445 in 2017 to 595 in 2022.","place":"Yangtze River, China","lon":114.3,"lat":30.6,"source":"Live Science","date":"2026-02-12","url":"https://www.livescience.com/planet-earth/rivers-oceans/china-banned-fishing-in-its-biggest-river-and-species-are-starting-to-recover","color":"#4A3A2E","photo_ref":"","photo_credit":"CFOTO via Getty Images (main image on the page)"},{"id":"kenya-flies","list":"hope","title":"From waste to wealth: How fly farming is building climate resilience and creating jobs","description":"In Mukuru, an informal settlement in Nairobi, black soldier fly larvae turn food waste into animal feed and fertiliser, creating jobs, cutting feed costs by about 30% and, by clearing waste, reducing flooding.","place":"Mukuru, Nairobi, Kenya","lon":36.88,"lat":-1.31,"source":"Global Center on Adaptation","date":"2025-03-30","url":"https://gca.org/from-waste-to-wealth-how-fly-farming-is-building-climate-resilience-and-creating-jobs/","color":"#44402E","photo_ref":"","photo_credit":""},{"id":"guyana","list":"hope","title":"Guyana's forests drive a new era of low-carbon development","description":"Guyana has kept more than 99% of its forest, about 18 million hectares, and turned it into income through carbon markets, earning 33.47 million carbon credits for 2022 under its low-carbon development strategy.","place":"Guyana","lon":-58.9,"lat":5.0,"source":"CVF-V20","date":"2026-05-28","url":"https://cvfv20.org/guyanas-forests-drive-a-new-era-of-low-carbon-development/","color":"#2E4A33","photo_ref":"","photo_credit":"Shutterstock"},{"id":"panama","list":"hope","title":"Adapting to climate change in Panama","description":"Farming communities, including in the Santa María watershed, are adopting better water management, agroforestry and ecosystem restoration to cope with heat, shifting rainfall and water scarcity. The project supports more than 114,000 people and has restored 600 hectares.","place":"Santa María watershed, Panama","       for(let i = 0; i < a.length; i += 3){
        const p = [a[i], a[i+1]]; if(d3.geoDistance(p, ctr) > 1.5533) continue;
        const q = proj(p), v = 0.13 + 0.87 * Math.min(1, Math.pow(a[i+2], 0.85) / L.norm * 7);
        ctx.fillStyle = 'rgba(' + col + ',' + (v * alpha).toFixed(3) + ')'; ctx.fillRect(q[0] - h, q[1] - h, sz, sz);
      }
      ctx.globalCompositeOperation = 'source-over';
    } else {                                           // plain dots, fourth-root growth with zoom as on the main site
      const a = L.pts, r = Math.max(0.6, 1.2 * Math.min(2.6, Math.max(0.6, Math.pow(proj.scale() / 520, 0.25))));
      ctx.fillStyle = 'rgb(' + col + ')'; ctx.globalAlpha = 0.9 * alpha; ctx.beginPath();
      for(let i = 0; i < a.length; i += 2){
        const p = [a[i], a[i+1]]; if(d3.geoDistance(p, ctr) > 1.5533) continue;
        const q = proj(p); ctx.moveTo(q[0] + r, q[1]); ctx.arc(q[0], q[1], r, 0, 6.2832);
      }
      ctx.fill(); ctx.globalAlpha = 1;
    }
  }

  function resize(){
    const r = wrap.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if(relief) relief.size(W, H, dpr);
    const narrow = W < 760;
    CX = narrow ? W / 2 : W * 0.7;                     // globe centred in the right 60%
    R = narrow ? Math.min(W * 0.44, H * 0.42) : Math.min(W * 0.26, H * 0.42);
    draw();
  }

  // screen positions of the visible stories, refreshed every frame
  let pts = [];
  function draw(){
    if(!W) return;
    proj.translate([CX, H / 2]).scale(R * k).rotate(rot);
    ctx.clearRect(0, 0, W, H);
    if(relief && relief.ok()) relief.draw();
    else{ ctx.beginPath(); path(sphere); ctx.fillStyle = '#0B121B'; ctx.fill(); }
    ctx.beginPath(); path(grat); ctx.strokeStyle = 'rgba(236,234,229,.07)'; ctx.lineWidth = .5; ctx.stroke();
    for(const key in LAY) if(shown[key] > 0.01) drawLayer(key, shown[key]);
    ctx.beginPath(); path(sphere); ctx.strokeStyle = 'rgba(236,234,229,.35)'; ctx.lineWidth = 1; ctx.stroke();

    const ctr = [-rot[0], -rot[1]], r = 5.5 * Math.pow(k, 0.25);
    pts = [];
    S.forEach((s, i) => {
      const p = [s.lon, s.lat];
      if(d3.geoDistance(p, ctr) > 1.52) return;          // round the back
      const q = proj(p); pts.push({ i, x:q[0], y:q[1] });
    });
    // draw the selected one last, so it sits on top of any neighbour
    pts.slice().sort((a, b) => (a.i === active) - (b.i === active)).forEach(({ i, x, y }) => {
      const on = i === active, hot = i === hover;
      if(on){ ctx.beginPath(); ctx.arc(x, y, r + 6, 0, 6.2832); ctx.strokeStyle = 'rgba(236,234,229,.45)'; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
      ctx.fillStyle = on ? '#ECEAE5' : hot ? 'rgba(236,234,229,.5)' : 'rgba(236,234,229,.16)'; ctx.fill();
      ctx.strokeStyle = '#ECEAE5'; ctx.lineWidth = 1.2; ctx.stroke();
    });
  }

  function hit(x, y){
    let best = -1, bd = 14 * 14;                         // generous target for small circles
    for(const p of pts){ const d = (p.x - x) ** 2 + (p.y - y) ** 2; if(d < bd){ bd = d; best = p.i; } }
    return best;
  }

  // ---------- story card ----------
  function show(i){
    active = i; spin = false;
    const s = S[i];
    $('photo').style.background = s.color || '#2E3A4A';
    $('meta').textContent = s.place;
    $('ctitle').textContent = s.title;
    // the description, with one optional inline link (e.g. "elephant seals" -> the seal data)
    const desc = $('cdesc'); desc.textContent = '';
    const L = s.link, at = L ? s.description.indexOf(L.text) : -1;
    if(at < 0) desc.textContent = s.description;
    else{
      const a = document.createElement('a');
      a.className = 'link'; a.href = L.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = L.text;
      if(L.note) a.title = L.note;
      desc.append(s.description.slice(0, at), a, s.description.slice(at + L.text.length));
    }
    $('csrc').textContent = s.source + (s.date ? ', ' + fmtDate(s.date) : '');
    $('more').href = s.url;
    for(const key in want) want[key] = 0;
    (s.layers || []).forEach(l => { if(l.key in LAY) want[l.key] = l.alpha; });
    const lg = $('legend'); lg.innerHTML = '';
    (s.layers || []).forEach(l => {
      const row = document.createElement('span'), dot = document.createElement('i');
      dot.style.background = STY[l.key].color; row.append(dot, STY[l.key].label); lg.append(row);
    });
    lg.hidden = !(s.layers || []).length;
    const card = $('card'); card.hidden = true; void card.offsetWidth; card.hidden = false;   // replay the fade-in
    $('hint').hidden = true;
    turnTo([s.lon, s.lat], s.zoom || 1);
  }
  function hide(){ for(const key in want) want[key] = 0; active = -1; $('card').hidden = true; $('hint').hidden = false; draw(); }
  $('close').addEventListener('click', hide);
  $('next').addEventListener('click', () => show((active + 1) % S.length));
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') hide();
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){                // step through the stories
      const n = S.length, step = e.key === 'ArrowRight' ? 1 : -1;
      show(active < 0 ? (step > 0 ? 0 : n - 1) : (active + step + n) % n);
    }
  });

  // ease the globe round so the story faces the viewer
  function turnTo(lonlat, kTo){
    const from = [-rot[0], -rot[1]], ip = d3.geoInterpolate(from, lonlat), k0 = k;
    let t0 = null;                                     // clock starts on the animation's first frame
    const dur = Math.min(1200, 400 + d3.geoDistance(from, lonlat) * 400);
    anim = now => {
      if(t0 === null) t0 = now;
      const t = Math.min(1, Math.max(0, (now - t0) / dur)), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const p = ip(e); rot = [-p[0], -p[1]]; k = k0 + (kTo - k0) * e;
      if(t >= 1) anim = null;
    };
  }

  // ---------- pointer: hover, click, drag, wheel zoom ----------
  const tip = $('tip');
  let drag = null;
  cv.addEventListener('pointerdown', e => {
    drag = { x:e.clientX, y:e.clientY, rot:rot.slice(), moved:false }; cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    if(drag){
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if(Math.abs(dx) + Math.abs(dy) > 4){ drag.moved = true; spin = false; anim = null; }
      if(drag.moved){ const s = 0.25 / k; rot = [drag.rot[0] + dx * s, Math.max(-85, Math.min(85, drag.rot[1] - dy * s))]; }
      tip.classList.remove('on'); return;
    }
    hover = hit(x, y);
    cv.classList.toggle('hot', hover >= 0);
    if(hover >= 0){
      const s = S[hover]; tip.innerHTML = ''; tip.append(s.title); const sm = document.createElement('small'); sm.textContent = s.place; tip.append(sm);
      tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('on');
    } else tip.classList.remove('on');
  });
  cv.addEventListener('pointerleave', () => { hover = -1; tip.classList.remove('on'); cv.classList.remove('hot'); });
  cv.addEventListener('pointerup', e => {
    const was = drag; drag = null;
    if(was && !was.moved){
      const b = cv.getBoundingClientRect(), i = hit(e.clientX - b.left, e.clientY - b.top);
      if(i >= 0) show(i);
    }
  });
  cv.addEventListener('wheel', e => { e.preventDefault(); k = Math.max(1, Math.min(4, k * Math.exp(-e.deltaY * 0.0015))); spin = false; }, { passive:false });

  // ---------- loop ----------
  let last = 0;
  function tick(now){
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
    for(const key in shown) shown[key] += (want[key] - shown[key]) * (1 - Math.pow(0.03, dt));   // ~0.6 s fade
    if(anim) anim(now);
    else if(spin) rot = [rot[0] + dt * 4, rot[1]];                    // slow drift until the first interaction
    draw();
    requestAnimationFrame(tick);
  }
  addEventListener('resize', resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
  resize();
  // open on the first story (Malawi's flood detectors), already facing it rather than flying there
  { const s0 = S[0]; rot = [-s0.lon, -s0.lat]; k = s0.zoom || 1; show(0);
    for(const key in want) shown[key] = want[key]; anim = null; }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
