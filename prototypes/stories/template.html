<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories of Resilience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* same palette and type as the main site (site-src/template.html, LOOK) */
  :root{
    --bg:#05080E; --text:#ECEAE5; --muted:#8B95A1; --faint:#5C6773; --line:#222C38;
    --card:rgba(5,8,14,.84);
    --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --disp:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--text); font:15px/1.55 var(--sans); overflow:hidden}

  .stage{height:100%; display:grid; grid-template-columns:minmax(0,40fr) minmax(0,60fr)}
  /* the globe lives behind the whole page (as on the main site), so a zoomed globe isn't cut at the column edge;
     the left column fades from the background so the text stays readable */

  /* ---------- left: title, subtitle, story card ---------- */
  .panel{position:relative; z-index:1; padding:9vh 2vw 5vh 4vw; overflow-y:auto; scrollbar-width:none;
    background:linear-gradient(90deg, rgba(5,8,14,.96) 0%, rgba(5,8,14,.9) 70%, rgba(5,8,14,0) 100%)}
  .panel::-webkit-scrollbar{display:none}
  h1{font:400 clamp(1.8rem,2.7vw,2.6rem)/1.13 var(--disp); letter-spacing:-.02em; margin:0; max-width:18ch}
  .sub{color:var(--muted); font-size:1rem; line-height:1.5; margin:1.1rem 0 0; max-width:42ch}
  .hint{font:600 10.5px var(--sans); letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    margin-top:3.5vh; display:flex; align-items:center; gap:.6rem}
  .hint[hidden]{display:none}
  .hint i{width:9px; height:9px; border-radius:50%; border:1.2px solid var(--text); background:rgba(236,234,229,.16)}

  .card{margin-top:3.5vh; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:3px;
    padding:14px 14px 16px; position:relative; animation:in .35s ease}
  @keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .card[hidden]{display:none}
  .photo{position:relative; aspect-ratio:16/9; border-radius:2px}
  .meta{font:600 10px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px}
  .card h2{font:500 1.2rem/1.25 var(--disp); letter-spacing:-.01em; margin:0}
  /* inline link: the design system's .wm-link (underlined, the text's own colour) */
  .card p a.link{color:inherit; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px; text-decoration-color:var(--muted)}
  .card p a.link:hover, .card p a.link:focus-visible{text-decoration-color:currentColor}
  .card p{color:#D9D6CF; font-size:.9rem; line-height:1.55; margin:.6rem 0 0}
  .legend{display:flex; flex-direction:column; gap:.35rem; margin-top:12px; font-size:.78rem; color:var(--muted); line-height:1.35}
  .legend[hidden]{display:none}
  .legend span{display:flex; align-items:baseline; gap:.55rem}
  .legend i{width:7px; height:7px; border-radius:50%; flex:none; transform:translateY(-1px)}
  .foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px}
  .src{color:var(--faint); font-size:.75rem}
  /* link to the source: bottom-right corner of the photo */
  .more{position:absolute; right:10px; bottom:10px; width:34px; height:34px; border-radius:50%;
    border:1px solid rgba(236,234,229,.6); background:rgba(5,8,14,.55); display:grid; place-items:center;
    color:var(--text); text-decoration:none}
  .more:hover{border-color:var(--text); background:rgba(5,8,14,.8)}
  /* next story: bottom-right corner of the card */
  /* the design system's .wm-btn: an outlined rectangle with 2px corners */
  .next{flex:none; display:inline-flex; align-items:center; gap:.5rem; background:none; color:var(--text); cursor:pointer;
    border:1px solid rgba(236,234,229,.55); border-radius:2px; padding:.42rem .9rem; font:500 .8rem var(--sans);
    transition:background .15s, border-color .15s}
  .next:hover{border-color:var(--text); background:rgba(236,234,229,.08)}
  .next svg{width:12px; height:12px}
  .src{margin-right:1rem}
  .more svg{width:13px; height:13px}
  .close{position:absolute; top:20px; right:20px; width:26px; height:26px; border-radius:50%; border:0; cursor:pointer;
    background:rgba(5,8,14,.6); color:var(--text); font:400 16px/26px var(--sans); padding:0}

  /* ---------- right: globe ---------- */
  .globewrap{position:fixed; inset:0; z-index:0}
  .globewrap canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #globe{cursor:grab} #globe.hot{cursor:pointer} #globe:active{cursor:grabbing}
  #relief{pointer-events:none}
  .tip{position:absolute; pointer-events:none; max-width:260px; font:500 12.5px/1.35 var(--sans); color:var(--text);
    background:var(--card); border:1px solid var(--line); border-radius:3px; padding:6px 9px; opacity:0;
    transform:translate(14px,-50%); transition:opacity .15s}
  .tip.on{opacity:1}
  .tip small{display:block; color:var(--muted); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; margin-top:2px}

  @media (max-width:760px){
    body{overflow:auto}
    .stage{grid-template-columns:1fr; grid-template-rows:auto 70vh; height:auto}
    .panel{padding:32px 16px 8px; overflow:visible}
    .panel{background:none}
    .globewrap{position:relative; inset:auto; grid-row:2}
  }
</style>

<script>
(function(){
  const $ = id => document.getElementById(id);

  const fmtDate = d => { const p = String(d).split('-'); return p.length === 3 ? (+p[2]) + ' ' + MONTHS[p[1] - 1] + ' ' + p[0] : p[0]; };

  $('title').textContent = DATA.title;

  const grat = d3.geoGraticule10(), sphere = { type:'Sphere' };

  const relief = (function(){
    const el = document.getElementById('relief'), gl = el.getContext('webgl2', { premultipliedAlpha:true, alpha:true });
    if(!gl) return null;
    const VS = `#version 300 es
      in vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;
    const FS = `#version 300 es
      precision highp float;
      uniform vec2 uT; uniform float uK, uDpr, uH, uLam, uPhi;
      uniform sampler2D uTex; out vec4 o;
      const float PI=3.14159265359;

        float lam=atan(x, z*cp+y*sp)-uLam, phi=asin(clamp(y*cp-z*sp,-1.,1.));

        float ux=dFdx(u), ux2=dFdx(u2), uy=dFdy(u), uy2=dFdy(u2);
        vec2 gx=vec2(abs(ux)<abs(ux2)?ux:ux2, dFdx(v)), gy=vec2(abs(uy)<abs(uy2)?uy:uy2, dFdy(v));

    const U = {}; ['uT','uK','uDpr','uH','uLam','uPhi','uTex'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      ok: () => ready,

      ctx.fillStyle = 'rgb(' + col + ')'; ctx.globalAlpha = 0.9 * alpha; ctx.beginPath();

  // screen positions of the visible stories, refreshed every frame
  let pts = [];
  function draw(){
    if(!W) return;

    ctx.clearRect(0, 0, W, H);
    if(relief && relief.ok()) relief.draw();

    $('meta').textContent = s.place;

      tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('on');
    } else tip.classList.remove('on');
  });
  cv.addEventListener('pointerleave', () => { hover = -1; tip.classList.remove('on'); cv.classList.remove('hot'); });
  cv.addEventListener('pointerup', e => {
    const was = drag; drag = null;
    if(was && !was.moved){
      const b = cv.getBoundingClientRect(), i = hit(e.clientX - b.left, e.clientY - b.top);
      if(i >= 0) show(i);
    }
  });
  cv.addEventListener('wheel', e => { e.preventDefault(); k = Math.max(1, Math.min(4, k * Math.exp(-e.deltaY * 0.0015))); spin = false; }, { passive:false });

  // ---------- loop ----------
  let last = 0;
  function tick(now){
    const dt = last ? Math.min(0.1, (now - last) / 1000) : 0; last = now;
    for(const key in shown) shown[key] += (want[key] - shown[key]) * (1 - Math.pow(0.03, dt));   // ~0.6 s fade
    if(anim) anim(now);
    else if(spin) rot = [rot[0] + dt * 4, rot[1]];                    // slow drift until the first interaction
    draw();
    requestAnimationFrame(tick);
  }
  addEventListener('resize', resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
  resize();
  // open on the first story (Malawi's flood detectors), already facing it rather than flying there
  { const s0 = S[0]; rot = [-s0.lon, -s0.lat]; k = s0.zoom || 1; show(0);
    for(const key in want) shown[key] = want[key]; anim = null; }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
